<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>PSR-E383 Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
:root{
  --font-display:'Baloo 2',sans-serif; --font-body:'Nunito','Segoe UI',sans-serif; --font-mono:'Share Tech Mono',monospace;
  --black:#211E1B; --black-deep:#0F0D0B;
  --ivory:#FFFDF6; --white:#FFFFFF;
  --gold:#E7B923; --gold-dark:#C2980D; --gold-bg:#FFF3D0; --gold-text:#8A6600;
  --red:#D6293E; --red-dark:#A81F30; --red-bg:#FCE1E5; --red-text:#9C1B29;
  --ink:#241F1A; --ink-soft:#7C7263;
  --line:#E7DCC6; --bg:#FBF6EA; --bg-soft:#F2E9D4;
  --card:#FFFFFF;
}
body{background:var(--bg-soft);font-family:var(--font-body);color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;
  background-image:radial-gradient(ellipse at 15% 10%,rgba(33,30,27,0.06) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 90%,rgba(214,41,62,0.06) 0%,transparent 55%),
    radial-gradient(ellipse at 50% 40%,rgba(231,185,35,0.08) 0%,transparent 65%);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:8px}
h1,h2{font-family:var(--font-display)}

@keyframes pulseGlow{0%,100%{box-shadow:0 4px 0 var(--red-dark),0 0 0 0 rgba(214,41,62,0)}50%{box-shadow:0 4px 0 var(--red-dark),0 0 0 8px rgba(214,41,62,0.18)}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}
.slide-up{animation:slideUp .32s ease}
.pop-in{animation:popIn .28s cubic-bezier(.34,1.56,.64,1)}
.current-pulse{animation:pulseGlow 2.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}

#app{width:100%;min-height:100vh;display:flex;flex-direction:column}
.wrap{padding:16px 12px 32px;max-width:640px;margin:0 auto;width:100%}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:clamp(13px,3.4vw,15px);letter-spacing:.02em;border-radius:14px;padding:10px 16px;border:2px solid transparent;transition:transform .08s ease,box-shadow .08s ease;min-height:40px}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn-black{background:var(--black);color:var(--ivory);border-color:var(--black-deep);box-shadow:0 4px 0 var(--black-deep)}
.btn-black:active:not(:disabled){box-shadow:0 1px 0 var(--black-deep)}
.btn-white{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.btn-white:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.btn-gold{background:var(--gold);color:var(--gold-text);border-color:var(--gold-dark);box-shadow:0 4px 0 var(--gold-dark)}
.btn-gold:active:not(:disabled){box-shadow:0 1px 0 var(--gold-dark)}
.btn-wide{width:100%}

/* ── HEADER ── */
.ya-header-badges{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ya-home-btn{font-family:var(--font-display);font-weight:700;font-size:13px;background:var(--black);color:var(--ivory);border:2px solid var(--black-deep);border-radius:14px;padding:8px 14px;box-shadow:0 3px 0 var(--black-deep)}
.ya-home-btn:active{box-shadow:0 1px 0 var(--black-deep);transform:translateY(2px)}
.back-btn{font-family:var(--font-display);font-weight:700;font-size:13px;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:8px 14px;box-shadow:0 3px 0 var(--line)}
.back-btn:active{box-shadow:0 1px 0 var(--line);transform:translateY(2px)}

.ya-eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:800;margin-bottom:2px}
.ya-title{font-size:clamp(24px,7vw,30px);font-weight:800;color:var(--ink);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.ya-subtitle{font-size:13px;color:var(--ink-soft);margin:4px 0 16px}

.specs-card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 10px;margin-bottom:18px;box-shadow:0 3px 0 var(--line)}
.specs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 4px}
.spec-item{text-align:center}
.spec-item b{display:block;font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--red-text);line-height:1.1}
.spec-item span{display:block;font-size:9.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}

.complete-banner{background:linear-gradient(90deg,var(--gold-bg),var(--red-bg));border:2px solid var(--gold-dark);border-radius:16px;padding:14px 16px;margin-bottom:18px;font-size:13px;line-height:1.5;text-align:center}
.complete-banner b{display:block;font-family:var(--font-display);font-size:15.5px;margin-bottom:4px;color:var(--ink)}

/* ── PROGRESS ── */
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.progress-track{flex:1;height:14px;background:#fff;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:999px;transition:width .3s ease}
.progress-label{font-family:var(--font-display);font-weight:700;font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
.streak-badge{font-family:var(--font-display);font-weight:800;font-size:12.5px;background:var(--black);color:var(--gold);border-radius:999px;padding:5px 10px;white-space:nowrap}

/* ── SESSION PATH (home grid) ── */
.day-path{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:16px 8px;margin-bottom:8px}
.day-node-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.day-node{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);background:#fff;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:17px;box-shadow:0 4px 0 var(--line);transition:transform .08s ease}
.day-node:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.day-node.current{border-color:var(--red);color:var(--red-text);box-shadow:0 4px 0 var(--red-dark)}
.day-node.done{background:var(--black);border-color:var(--black-deep);color:var(--gold);box-shadow:0 4px 0 var(--black-deep)}
.day-caption{font-size:10.5px;color:var(--ink-soft);text-align:center;max-width:72px;line-height:1.25}
.day-caption b{color:var(--ink);display:block;font-weight:700}

/* ── RESUME / TIP BANNER ── */
.resume-banner{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line);padding:16px 18px;margin:22px 0 8px;display:flex;flex-direction:column;gap:10px}
.resume-banner-title{font-family:var(--font-display);font-weight:800;font-size:16px}
.resume-banner-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.5}

.ref-icon-row{display:flex;gap:8px;margin-bottom:10px}
.ref-icon-btn{flex:1;font-size:19px;line-height:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 0;box-shadow:0 3px 0 var(--line);text-align:center}
.ref-icon-btn:active{box-shadow:0 1px 0 var(--line);transform:translateY(2px)}
.ref-icon-btn.active{background:var(--black);border-color:var(--black-deep);box-shadow:0 3px 0 var(--black-deep)}

.ref-panel{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:18px;box-shadow:0 3px 0 var(--line)}
.ref-panel-title{font-family:var(--font-display);font-weight:700;font-size:13.5px;color:var(--ink);margin-bottom:10px}
.ref-panel dl{font-size:12.5px;line-height:1.6}
.ref-panel dt{font-family:var(--font-display);font-weight:700;color:var(--red-text);margin-top:8px}
.ref-panel dt:first-child{margin-top:0}
.ref-panel dd{color:var(--ink-soft)}
.ref-panel dt a{color:inherit;text-decoration:underline;text-decoration-color:var(--line)}
.acc-group-title{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-text);margin:10px 0 4px}
.acc-group-title:first-child{margin-top:0}
.acc-note{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}

.link-row{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.link-btn{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 14px;font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--ink);box-shadow:0 3px 0 var(--line);text-decoration:none}
.link-btn:active{box-shadow:0 1px 0 var(--line);transform:translateY(2px)}

.reset-row{text-align:center;margin-top:24px}
.reset-btn{background:transparent;color:var(--ink-soft);font-size:11.5px;text-decoration:underline;padding:6px}
.reset-btn:hover{color:var(--red)}

.ya-footer{font-size:11px;line-height:1.6;color:var(--ink-soft);margin-top:22px;padding-top:14px;border-top:1px dashed var(--line)}

/* ── SESSION DETAIL ── */
.session-card{background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:0 4px 0 var(--line);padding:18px 18px 20px;margin-bottom:16px}
.session-tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:800}
.session-title{font-size:clamp(20px,6vw,25px);font-weight:800;color:var(--ink);margin:4px 0 14px;line-height:1.1}

.goal-chip{background:var(--gold-bg);border-radius:14px;padding:11px 14px;margin-bottom:14px;font-size:13px;line-height:1.55}
.goal-chip b{display:block;font-family:var(--font-display);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-text);margin-bottom:3px}

.intro-text{font-size:14px;line-height:1.6;margin-bottom:14px;color:var(--ink)}

.steps-list{margin-bottom:4px}
.step-row{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.step-row:last-child{border-bottom:none}
.step-num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--black);color:var(--gold);font-family:var(--font-mono);font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step-body{flex:1}
.step-time{display:block;font-family:var(--font-display);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--red-text);margin-bottom:3px;font-weight:700}
.step-text{font-size:13.5px;line-height:1.55;color:var(--ink)}

.keysteps-box{margin:14px 0;border:2px dashed var(--gold-dark);border-radius:14px;padding:11px 13px;font-size:12.5px;line-height:1.6;background:var(--gold-bg)}
.keysteps-box b{display:block;font-family:var(--font-display);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-text);margin-bottom:3px}

.ref-box{margin:10px 0;border:1.5px solid var(--line);border-radius:12px;padding:9px 13px;font-size:12.5px;line-height:1.55;background:#fff}
.ref-box b{display:block;font-family:var(--font-display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px}

.exercise-label{font-family:var(--font-display);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:16px 0 6px}

.mistake-box{margin:10px 0;border-left:4px solid var(--black);background:var(--bg-soft);border-radius:0 12px 12px 0;padding:9px 13px;font-size:12.5px;line-height:1.55}
.mistake-box b{display:block;font-family:var(--font-display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px}

.tip-box{margin:14px 0;border-left:4px solid var(--red);background:var(--red-bg);border-radius:0 14px 14px 0;padding:10px 13px;font-size:12.5px;line-height:1.55}
.tip-box b{display:block;font-family:var(--font-display);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--red-text);margin-bottom:3px}

.control-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.timer-chip{font-family:var(--font-mono);font-size:16px;background:var(--black);color:var(--gold-bg);border-radius:12px;padding:9px 14px;letter-spacing:.03em;min-width:66px;text-align:center}
.timer-chip.running{color:var(--gold)}
.timer-btn{font-family:var(--font-display);font-weight:700;font-size:12.5px;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:9px 13px;box-shadow:0 3px 0 var(--line)}
.timer-btn:active{box-shadow:0 1px 0 var(--line);transform:translateY(2px)}

.metro-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;padding:10px 12px;background:var(--bg-soft);border:1.5px solid var(--line);border-radius:14px}
.metro-label{font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);width:100%}
.metro-bpm{font-family:var(--font-mono);font-size:14px;background:var(--black);color:var(--gold);border-radius:10px;padding:7px 12px;min-width:78px;text-align:center}
.metro-btn{font-family:var(--font-display);font-weight:700;font-size:12.5px;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 3px 0 var(--line)}
.metro-btn:active{box-shadow:0 1px 0 var(--line);transform:translateY(2px)}
.metro-btn.metro-toggle{background:var(--red);color:#fff;border-color:var(--red-dark);box-shadow:0 3px 0 var(--red-dark)}
.metro-btn.metro-toggle:active{box-shadow:0 1px 0 var(--red-dark)}

.notes-label{font-family:var(--font-display);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:16px 0 6px}
.notes-area{width:100%;min-height:64px;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-family:var(--font-body);font-size:13px;line-height:1.5;color:var(--ink);background:#fff;resize:vertical}
.notes-area:focus-visible{outline:3px solid var(--red);outline-offset:1px}

.mark-btn{width:100%;font-family:var(--font-display);font-weight:700;font-size:14.5px;letter-spacing:.01em;border-radius:14px;padding:13px;border:2px solid var(--red-dark);background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-dark)}
.mark-btn:active{box-shadow:0 1px 0 var(--red-dark);transform:translateY(3px)}
.mark-btn.done{background:var(--black);border-color:var(--black-deep);color:var(--gold);box-shadow:0 4px 0 var(--black-deep)}
.mark-btn.done:active{box-shadow:0 1px 0 var(--black-deep)}

.nav-row{display:flex;gap:8px;margin-top:4px}
.nav-btn{flex:1;font-family:var(--font-display);font-weight:700;font-size:13.5px;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 4px 0 var(--line)}
.nav-btn:active:not(:disabled){box-shadow:0 1px 0 var(--line);transform:translateY(3px)}
.nav-btn:disabled{opacity:.35}

/* ── PRINT VIEW ── */
#printArea{display:none}
@media print{
  body{background:#fff}
  #app{display:none}
  #printArea{display:block;color:#111;font-family:var(--font-body)}
  #printArea h1{font-family:var(--font-display);font-size:22px;margin-bottom:4px}
  #printArea .print-session{page-break-inside:avoid;border-bottom:1px solid #999;padding:10px 0 14px;margin-bottom:6px}
  #printArea h2{font-family:var(--font-display);font-size:15px;margin:0 0 6px}
  #printArea .print-field{font-size:11.5px;line-height:1.45;margin:3px 0}
  #printArea .print-field b{font-weight:700}
  #printArea ol{margin:4px 0 0 18px;padding:0;font-size:11.5px;line-height:1.5}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<script>
let DEV_MODE = false; // no dev-only content in this app; kept for Flag Atlas's shared override hook

/* ================================================================
   DATA — 15-session PSR-E383 curriculum (orientation session + original 14)
================================================================ */
const days = [
  {
    tag: "Layout",
    title: "Know your keyboard",
    goal: "By the end of this session, you can point to the main control groups on the PSR-E383 without hunting for them — front panel, Style controls, and rear panel.",
    intro: "This session is a map, not an exercise — a quick tour of where everything lives so the rest of this guide makes sense the first time you read it.",
    where: "All over the panel — this session is the map, not a single button.",
    what: "Nothing to turn on yet. This is an orientation to where the control groups live, so later sessions make sense at a glance.",
    press: "Nothing to press yet — just look at the layout as you read the four groups below.",
    hear: "Nothing to listen for yet.",
    steps: [
      ["0–4 min", "Front panel basics: [POWER] turns the keyboard on/off. MASTER VOLUME controls overall speaker/headphone volume. The LCD shows the selected Voice, Style, Song, tempo, chords and settings. [PORTABLE GRAND] instantly selects the Grand Piano Voice."],
      ["4–8 min", "Main selection buttons: [VOICE] selects instrument sounds, [SONG] selects built-in songs, [STYLE] selects accompaniment Styles. [SHIFT] gives certain buttons a second function. The number buttons and +/− pick numbers and change values. [FUNCTION] opens deeper settings. [REGIST MEMORY] saves and recalls a whole setup. [ARTICULATION] activates the special effect on S.Art Lite Voices."],
      ["8–12 min", "Style controls (used from Session 6 onward): [ACMP ON/OFF] turns automatic chord accompaniment on/off. [SYNC START] makes the Style wait for you to play. [START/STOP] starts/stops the Style. [INTRO/ENDING/rit.] plays an intro or ending. [MAIN/AUTO FILL] changes the accompaniment section or fill."],
      ["12–15 min", "Rear panel and ports: DC IN (power adapter), PHONES/OUTPUT (headphones or external speakers), AUX IN (line-in from another audio source), USB TO HOST (connect to a computer), SUSTAIN (optional sustain pedal), and the battery compartment (6 AA batteries)."]
    ],
    mistake: "Trying to memorize every button name today — you don't need to. Treat this session as a reference to flip back to.",
    tip: "You don't need to memorize any of this today — just get a rough sense of where each group of controls lives. Every later session tells you exactly which button to press and where it is."
  },
  {
    tag: "Panel",
    title: "Meet the panel",
    goal: "By the end of this session, you can power the keyboard on, find the volume and headphone jack, and play evenly across all 61 keys.",
    intro: "Before touching a single sound, get comfortable with power, volume, and how the layout is organized.",
    where: "[POWER] and MASTER VOLUME are on the top panel near the left edge; PHONES/OUTPUT is on the rear panel.",
    what: "[POWER] turns the keyboard on and off. MASTER VOLUME sets how loud it plays through the speakers or headphones.",
    press: "Press [POWER] once to turn on. Slide MASTER VOLUME to a low-to-moderate level. Plug headphones into PHONES/OUTPUT on the rear panel.",
    hear: "The LCD lights up when the keyboard powers on. With nothing plugged in you'll hear the built-in speakers; with headphones in, sound only comes through them.",
    steps: [
      ["0–5 min", "Power on with the included AC adapter, or load 6 AA batteries — Yamaha estimates about five hours of playing time on batteries, though actual life varies with use."],
      ["5–11 min", "Find the master volume slider, the LCD screen, and the headphone jack (labeled PHONES/OUTPUT). Plug in headphones once so quiet, private practice becomes a habit from day one."],
      ["11–15 min", "Play up and down the 61 keys at a steady volume, just to feel the key travel before anything else is layered on."]
    ],
    mistake: "Starting at full volume — begin low and raise it gradually, especially the first time you plug in headphones.",
    tip: "Practicing with headphones from the start removes any hesitation about being heard — useful for the rest of this plan."
  },
  {
    tag: "Touch",
    title: "Touch and dynamics",
    goal: "By the end of this session, you can explain what Touch Response does and pick a setting to practice with.",
    intro: "The keys are touch-sensitive: how hard you press changes the volume, like an acoustic piano.",
    where: "[FUNCTION] button, front panel.",
    what: "Touch Response changes how loud a note sounds based on how hard you press the key — like an acoustic piano.",
    press: "Press [FUNCTION] → use [+]/[−] to find TouchRes (Function 004) → press [+/YES] or [−/NO] to step through Soft, Medium, Hard, and Off.",
    hear: "The LCD shows \"TouchRes\" and the current setting name. Play the same note softly and firmly — Soft and Hard should sound clearly different in volume; Off should sound the same either way.",
    steps: [
      ["0–5 min", "Play the same note softly, then firmly, and listen for the volume difference — that's Touch Response working."],
      ["5–12 min", "Step through Soft, Medium, and Hard using the button sequence above, playing a few notes after each one. Medium is Yamaha's default and a reasonable place to start."],
      ["12–15 min", "Pick the setting that feels most natural to your hand and play a short scale using it."]
    ],
    mistake: "Leaving Touch Response on Off while trying to practice dynamics — Off makes every note the same volume no matter how hard you press.",
    tip: "Soft makes it easy to play loud, Hard takes a firmer press to get full volume, and Off removes dynamics entirely — useful for flat, even-volume playing, but not for practicing expression."
  },
  {
    tag: "Voices",

/* ================================================================
   STATE
================================================================ */
let page = "home"; // "home" | "detail"
let current = 0;
const completed = new Set();
const completedDates = {}; // dayIndex -> "YYYY-MM-DD" of when it was marked done
const notes = {}; // dayIndex -> free-text note
const STORAGE_KEY = "psr-e383-progress";
let storageAvailable = false;

let timerSeconds = 15 * 60;
let timerInterval = null;

let metronomeBpm = 100;
let metronomeRunning = false;
let metronomeTimer = null;
let audioCtx = null;

let openRefPanel = null; // null | "glossary" | "accessories" | "faq" | "next"
function toggleRefPanel(name){
  openRefPanel = openRefPanel === name ? null : name;
  render();
}

function formatTime(s){
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}
function stopTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
}
function resetTimer(){
  stopTimer();
  timerSeconds = 15 * 60;
}
function startTimer(){
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    if (timerSeconds > 0){
      timerSeconds--;
      updateTimerUI();
    } else {
      stopTimer();
      updateTimerUI();
    }
  }, 1000);
  updateTimerUI();
}
function updateTimerUI(){
  const chip = document.getElementById("timerDisplay");
  const toggle = document.getElementById("timerToggle");
  if (chip){
    chip.textContent = formatTime(timerSeconds);
    chip.classList.toggle("running", !!timerInterval);
  }
  if (toggle) toggle.textContent = timerInterval ? "Pause" : "Start";
}

/* ---------- Metronome ---------- */
function ensureAudioCtx(){
  if (!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(err){ audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function playClick(){
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.value = 1200;
  gain.gain.setValueAtTime(0.001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + 0.002);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.07);
}
function startMetronome(){
  if (metronomeRunning) return;
  ensureAudioCtx();
  metronomeRunning = true;
  playClick();
  metronomeTimer = setInterval(playClick, Math.round(60000 / metronomeBpm));
  updateMetronomeUI();
}
function stopMetronome(){
  clearInterval(metronomeTimer);
  metronomeTimer = null;
  metronomeRunning = false;
  updateMetronomeUI();
}
function changeMetronomeBpm(delta){
  metronomeBpm = Math.max(40, Math.min(240, metronomeBpm + delta));
  if (metronomeRunning){
    clearInterval(metronomeTimer);
    metronomeTimer = setInterval(playClick, Math.round(60000 / metronomeBpm));
  }
  updateMetronomeUI();
}
function updateMetronomeUI(){
  const toggle = document.getElementById("metroToggle");
  const bpmLabel = document.getElementById("metroBpm");
  if (toggle) toggle.textContent = metronomeRunning ? "⏹ Stop" : "▶ Click";
  if (bpmLabel) bpmLabel.textContent = metronomeBpm + " BPM";
}

/* ---------- Storage ---------- */
function testStorage(){
  try{
    const k = "__psr_e383_test__";
    localStorage.setItem(k, "1");
    localStorage.removeItem(k);
    return true;
  } catch(err){ return false; }
}
function loadProgress(){
  storageAvailable = testStorage();
  if (!storageAvailable) return;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const data = JSON.parse(raw);
      (data.completed || []).forEach(i => completed.add(i));
      if (data.completedDates && typeof data.completedDates === "object"){
        Object.keys(data.completedDates).forEach(k => { completedDates[k] = data.completedDates[k]; });
      }
      if (data.notes && typeof data.notes === "object"){
        Object.keys(data.notes).forEach(k => { notes[k] = data.notes[k]; });
      }
      if (typeof data.lastDay === "number" && data.lastDay >= 0 && data.lastDay < days.length){
        current = data.lastDay;
      }
    }
  } catch(err){ /* ignore, fall back to defaults */ }
}
function saveProgress(){
  if (!storageAvailable) return;
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      completed: [...completed],
      completedDates,
      notes,
      lastDay: current
    }));
  } catch(err){ /* fail silently */ }
}
function todayStr(){
  return new Date().toISOString().slice(0, 10);
}
function computeStreak(){
  const dateSet = new Set(Object.values(completedDates));
  if (dateSet.size === 0) return 0;
  let streak = 0;
  const cursor = new Date();
  // A streak still counts as "alive" if today has no entry yet but yesterday does.
  if (!dateSet.has(todayStr())) cursor.setDate(cursor.getDate() - 1);
  while (dateSet.has(cursor.toISOString().slice(0, 10))){
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

/* ================================================================
   NAVIGATION
================================================================ */
function exitApp(){ stopMetronome(); try{ window.parent.postMessage("exitYamaha", "*"); }catch(e){} }
function openDay(i){ stopMetronome(); current = i; page = "detail"; resetTimer(); render(); saveProgress(); }
function goHome(){ stopMetronome(); page = "home"; render(); }
function toggleComplete(){
  if (completed.has(current)){
    completed.delete(current);
    delete completedDates[current];
  } else {
    completed.add(current);
    completedDates[current] = todayStr();
  }
  render();
  saveProgress();
}
function updateNote(text){
  notes[current] = text;
  saveProgress();
}
function prevDay(){ if (current > 0){ stopMetronome(); current--; resetTimer(); render(); saveProgress(); } }
function nextDay(){ if (current < days.length - 1){ stopMetronome(); current++; resetTimer(); render(); saveProgress(); } }
function resetAllProgress(){
  completed.clear();
  Object.keys(completedDates).forEach(k => delete completedDates[k]);
  Object.keys(notes).forEach(k => delete notes[k]);
  current = 0;
  render();
  saveProgress();
}

  const pct = Math.round((completed.size / days.length) * 100);
  const streak = computeStreak();
  const allDone = completed.size === days.length;
  const nodes = days.map((d, i) => {
    const done = completed.has(i);
    const isCurrent = i === current && !done;
    const cls = done ? "done" : isCurrent ? "current current-pulse" : "";
    const icon = done ? "✓" : (i + 1);
    return `<div class="day-node-wrap">
      <button type="button" class="day-node ${cls}" data-day="${i}">${icon}</button>
      <span class="day-caption"><b>${d.tag}</b>${d.title.split(" ").slice(0,2).join(" ")}</span>
    </div>`;
  }).join("");

  const resumeIdx = Math.min(current, days.length - 1);
  const resumeDay = days[resumeIdx];
  const resumeLabel = completed.has(resumeIdx) ? "Revisit a session" : "Continue where you left off";

  return `<div class="wrap slide-up">
    <div class="ya-header-badges">
      <div>
        <div class="ya-eyebrow">Yamaha</div>
        <h1 class="ya-title">🎹 PSR-E383</h1>
      </div>
      <button type="button" class="ya-home-btn" id="homeExitBtn">🏠 Home</button>
    </div>
    <p class="ya-subtitle">15 practice sessions · 15 minutes a day</p>

    <div class="specs-card">
      <div class="specs-grid">
        <div class="spec-item"><b>61</b><span>Keys</span></div>
        <div class="spec-item"><b>650</b><span>Voices</span></div>
        <div class="spec-item"><b>260</b><span>Styles</span></div>
        <div class="spec-item"><b>125</b><span>Songs</span></div>
        <div class="spec-item"><b>152</b><span>Arpeggio types</span></div>
        <div class="spec-item"><b>48</b><span>Note polyphony</span></div>
      </div>
    </div>

    ${allDone ? `<div class="complete-banner"><b>🎉 All 15 sessions complete!</b>You've been through the whole PSR&#8209;E383 curriculum. Revisit any session below, keep your streak going with a review day, or reset to start fresh.</div>` : ""}

    <div class="ref-icon-row">
      <button type="button" class="ref-icon-btn ${openRefPanel === "glossary" ? "active" : ""}" data-panel="glossary" title="Glossary" aria-label="Glossary">📖</button>
      <button type="button" class="ref-icon-btn ${openRefPanel === "accessories" ? "active" : ""}" data-panel="accessories" title="Accessories" aria-label="Accessories">🎒</button>
      <button type="button" class="ref-icon-btn ${openRefPanel === "faq" ? "active" : ""}" data-panel="faq" title="FAQ" aria-label="FAQ">❓</button>
      <button type="button" class="ref-icon-btn ${openRefPanel === "next" ? "active" : ""}" data-panel="next" title="Where to go next" aria-label="Where to go next">🔗</button>
    </div>

    ${openRefPanel === "glossary" ? `<div class="ref-panel">
      <p class="ref-panel-title">📖 Glossary — what these words mean</p>
      <dl>
        <dt>Voice</dt><dd>An instrument sound — what you hear when you play a key.</dd>
        <dt>Style</dt><dd>An automatic backing band / rhythm arrangement.</dd>
        <dt>ACMP</dt><dd>Auto Accompaniment — lets your left hand control the backing Style.</dd>
        <dt>Split Point</dt><dd>The key that separates the accompaniment/chord area from the right-hand area.</dd>
        <dt>Touch Response</dt><dd>Changes how the keyboard responds to how hard you press a key.</dd>
        <dt>Polyphony</dt><dd>How many notes can sound at the same time.</dd>
        <dt>Arpeggio</dt><dd>Automatically plays a repeating pattern based on the notes/chord you hold.</dd>
        <dt>S.Art Lite</dt><dd>Voices with special playing-technique effects, like guitar harmonics or sax bends.</dd>
        <dt>MIDI</dt><dd>Performance data — which notes, timing, and how hard — sent between devices.</dd>
        <dt>LCD</dt><dd>The keyboard's built-in screen.</dd>
      </dl>
    </div>` : ""}

    ${openRefPanel === "accessories" ? `<div class="ref-panel">
      <p class="ref-panel-title">🎒 Accessories you can add</p>
      <p class="acc-group-title">Power</p>
      <dl>
        <dt>6× AA batteries</dt><dd>Alkaline or Ni-MH rechargeable — lets you play away from an outlet (about 5 hours per set, Yamaha estimates).</dd>
        <dt><a href="https://usa.yamaha.com/products/musical_instruments/keyboards/accessories/pa-130/index.html" target="_blank" rel="noopener noreferrer">PA-130 AC Adapter</a></dt><dd>Official spare/replacement power adapter — the same one included in the box.</dd>
      </dl>
      <p class="acc-group-title">Sustain pedals — plug into SUSTAIN</p>
      <dl>
        <dt><a href="https://usa.yamaha.com/products/music_production/accessories/fc5/index.html" target="_blank" rel="noopener noreferrer">FC5</a></dt><dd>Foot switch-style sustain pedal.</dd>
        <dt><a href="https://usa.yamaha.com/products/music_production/accessories/fc4a/index.html" target="_blank" rel="noopener noreferrer">FC4A</a></dt><dd>Piano-style sustain pedal with a more realistic feel.</dd>
      </dl>
      <p class="acc-group-title">Stand &amp; carry case</p>
      <dl>
        <dt><a href="https://usa.yamaha.com/products/musical_instruments/pianos/accessories/l3c/index.html" target="_blank" rel="noopener noreferrer">L3C</a></dt><dd>Lightweight, quick-release X-style keyboard stand.</dd>
        <dt><a href="https://usa.yamaha.com/products/musical_instruments/keyboards/accessories/sc-kb630/index.html" target="_blank" rel="noopener noreferrer">SC-KB630</a></dt><dd>Soft carry case sized for select Yamaha 61-key portable keyboards.</dd>
      </dl>
      <p class="acc-group-title">Headphones — plug into PHONES/OUTPUT</p>
      <dl>
        <dt><a href="https://usa.yamaha.com/products/musical_instruments/pianos/accessories/hph-50/index.html" target="_blank" rel="noopener noreferrer">HPH-50</a></dt><dd>Compact, affordable on-ear headphones.</dd>
        <dt><a href="https://usa.yamaha.com/products/musical_instruments/pianos/accessories/hph-100/index.html" target="_blank" rel="noopener noreferrer">HPH-100</a></dt><dd>Closed-back headphones with accurate, rich sound.</dd>
        <dt><a href="https://usa.yamaha.com/products/musical_instruments/pianos/accessories/hph-150/index.html" target="_blank" rel="noopener noreferrer">HPH-150</a></dt><dd>Open-air headphones with studio-quality tone.</dd>
      </dl>
      <p class="acc-note">A sustain pedal or a proper stand are the two upgrades beginners tend to notice first — everything here is optional.</p>
    </div>` : ""}

    ${openRefPanel === "faq" ? `<div class="ref-panel">
      <p class="ref-panel-title">❓ FAQ &amp; troubleshooting</p>
      <dl>
        <dt>The keyboard won't turn on</dt><dd>Make sure the AC adapter is fully plugged into both the wall and the DC IN jack, or that fresh/charged AA batteries are installed correctly. If the LCD stays dark, try a different outlet.</dd>
        <dt>No sound is coming out</dt><dd>Check MASTER VOLUME isn't turned all the way down, and that headphones aren't plugged into PHONES/OUTPUT — that jack mutes the built-in speakers.</dd>
        <dt>The keyboard turned itself off mid-practice</dt><dd>That's Auto Power Off, which shuts the keyboard down after a period of inactivity to save power. It can be disabled from the Function settings if you don't want it interrupting a session.</dd>
        <dt>A Registration Memory setup I saved is gone</dt><dd>Each save overwrites whatever was already in that numbered slot — if a new setup was saved there, the old one is replaced. There's no separate backup.</dd>
        <dt>ACMP is on but nothing happens when I play</dt><dd>Play below the Split Point, in the left-hand chord area, and make sure a Style is actually running — press [START/STOP] or play a note with [SYNC START] armed.</dd>
        <dt>My progress disappeared</dt><dd>Progress saves to this browser's local storage on this device only. Clearing browser data, using a private/incognito window, or opening the guide on a different device will reset or hide it.</dd>
      </dl>
    </div>` : ""}

    ${openRefPanel === "next" ? `<div class="ref-panel">
      <p class="ref-panel-title">🔗 Where to go next</p>
      <div class="link-row" style="margin:4px 0 0">
        <a class="link-btn" href="https://usa.yamaha.com/files/download/other_assets/1/2293841/PSR-E383_DL_EnFrEsDeZhRu_A0_web.pdf" target="_blank" rel="noopener noreferrer">📋 Data List — full Voice/Style/Song number index</a>
        <a class="link-btn" href="https://usa.yamaha.com/files/download/other_assets/3/2291233/PSR-E383_reference_manual_En_B0_web.pdf" target="_blank" rel="noopener noreferrer">📘 Full Reference Manual (PDF)</a>
        <a class="link-btn" href="https://usa.yamaha.com/files/download/other_assets/6/725646/iphone_ipad_connect_En_K0_web.pdf" target="_blank" rel="noopener noreferrer">📱 iPhone/iPad Connection Manual</a>
        <a class="link-btn" href="https://usa.yamaha.com/files/download/other_assets/9/1179159/android_connect_En_D0_web.pdf" target="_blank" rel="noopener noreferrer">🤖 Android Connection Manual</a>
      </div>
    </div>` : ""}

    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${completed.size}/${days.length} done</div>
      ${streak > 0 ? `<div class="streak-badge">🔥 ${streak}</div>` : ""}
    </div>

    <div class="day-path">${nodes}</div>

    <button type="button" class="resume-banner" id="resumeBtn" style="width:100%;text-align:left;cursor:pointer">
      <div class="resume-banner-title">🎹 ${resumeLabel}</div>
      <div class="resume-banner-sub">Session ${resumeIdx + 1} · ${resumeDay.title}</div>
    </button>

    <div class="reset-row">
      <button type="button" class="reset-btn" id="printGuideBtn">🖨️ Print all sessions</button>
      <span aria-hidden="true"> · </span>
      <button type="button" class="reset-btn" id="resetProgressBtn">Reset all progress</button>
    </div>

    <p class="ya-footer">Feature details reflect Yamaha's official PSR&#8209;E383 Owner's and Reference Manuals. Button names and positions can vary slightly by firmware revision, so check your own manual if something doesn't match. Progress saves to this device only.</p>
  </div>`;
}

function renderDetail(){
  const d = days[current];
  const isDone = completed.has(current);

  const stepsHtml = d.steps.map(([time, text], idx) => `
    <div class="step-row">
      <span class="step-num">${String(idx + 1).padStart(2, "0")}</span>
      <div class="step-body">
        <span class="step-time">${time}</span>
        <span class="step-text">${text}</span>
      </div>
    </div>`).join("");

  const linksHtml = d.links
    ? `<div class="link-row">${d.links.map(l => `<a class="link-btn" href="${l.url}" target="_blank" rel="noopener noreferrer">${l.emoji} ${l.label}</a>`).join("")}</div>`
    : "";

  return `<div class="wrap slide-up">
    <div class="ya-header-badges">
      <button type="button" class="back-btn" id="backBtn">◀ Sessions</button>
      <button type="button" class="ya-home-btn" id="homeExitBtn">🏠 Home</button>
    </div>

    <div class="session-card">
      <div class="session-tag">${d.tag} · Session ${current + 1} of ${days.length}</div>
      <h2 class="session-title">${d.title}</h2>
      <div class="goal-chip"><b>What you're learning</b>${d.goal}</div>
      <p class="intro-text">${d.intro}</p>

      <div class="ref-box"><b>📍 Where's the button?</b>${d.where}</div>
      <div class="ref-box"><b>⚙️ What it does</b>${d.what}</div>
      <div class="keysteps-box"><b>👉 Exactly what to press</b>${d.press}</div>
      <div class="ref-box"><b>👀 What you should see / hear</b>${d.hear}</div>

      <div class="exercise-label">⏱ 15-minute exercise</div>
      <div class="steps-list">${stepsHtml}</div>

      <div class="mistake-box"><b>⚠️ Common beginner mistake</b>${d.mistake}</div>
      ${linksHtml}
      <div class="tip-box"><b>💡 Tip</b>${d.tip}</div>

      <div class="control-strip">
        <span class="timer-chip" id="timerDisplay">${formatTime(timerSeconds)}</span>
        <button type="button" class="timer-btn" id="timerToggle">Start</button>
        <button type="button" class="timer-btn" id="timerResetBtn">Reset</button>
      </div>

      <div class="metro-strip">
        <span class="metro-label">🥁 Metronome</span>
        <span class="metro-bpm" id="metroBpm">${metronomeBpm} BPM</span>
        <button type="button" class="metro-btn" id="metroDown">−5</button>
        <button type="button" class="metro-btn" id="metroUp">+5</button>
        <button type="button" class="metro-btn metro-toggle" id="metroToggle">${metronomeRunning ? "⏹ Stop" : "▶ Click"}</button>
      </div>

      <label class="notes-label" for="sessionNotes">📝 Your notes for this session</label>
      <textarea class="notes-area" id="sessionNotes" placeholder="Tempo, song numbers, what to try next…">${notes[current] || ""}</textarea>

      <button type="button" class="mark-btn ${isDone ? "done" : ""}" id="markBtn" style="margin-top:14px">${isDone ? "Session marked complete" : "Mark session complete"}</button>
    </div>

    <div class="nav-row">
      <button type="button" class="nav-btn" id="prevBtn" ${current === 0 ? "disabled" : ""}>◀ Prev</button>
      <button type="button" class="nav-btn" id="nextBtn" ${current === days.length - 1 ? "disabled" : ""}>Next ▶</button>
    </div>
  </div>`;
}

function printGuide(){
  const area = document.getElementById("printArea");
  const sessionsHtml = days.map((d, i) => `
    <div class="print-session">
      <h2>Session ${i + 1} · ${d.title}</h2>
      <div class="print-field"><b>Learning:</b> ${d.goal}</div>
      <div class="print-field"><b>Where:</b> ${d.where}</div>
      <div class="print-field"><b>What it does:</b> ${d.what}</div>
      <div class="print-field"><b>Press:</b> ${d.press}</div>
      <div class="print-field"><b>See/hear:</b> ${d.hear}</div>
      <ol>${d.steps.map(([t, txt]) => `<li>${t} — ${txt}</li>`).join("")}</ol>
      <div class="print-field"><b>Common mistake:</b> ${d.mistake}</div>
      <div class="print-field"><b>Tip:</b> ${d.tip}</div>
    </div>`).join("");
  area.innerHTML = `<h1>🎹 PSR-E383 — 15-Session Practice Guide</h1>${sessionsHtml}`;
  window.print();
}

function bindEvents(){
  const app = document.getElementById("app");
  app.querySelectorAll("[id=homeExitBtn]").forEach(b => b.addEventListener("click", exitApp));
  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.addEventListener("click", goHome);
  const resumeBtn = document.getElementById("resumeBtn");
  if (resumeBtn) resumeBtn.addEventListener("click", () => openDay(Math.min(current, days.length - 1)));
  app.querySelectorAll("[data-day]").forEach(btn => {
    btn.addEventListener("click", () => openDay(parseInt(btn.dataset.day, 10)));
  });
  const resetBtn = document.getElementById("resetProgressBtn");
  if (resetBtn) resetBtn.addEventListener("click", resetAllProgress);
  const printBtn = document.getElementById("printGuideBtn");
  if (printBtn) printBtn.addEventListener("click", printGuide);
  app.querySelectorAll("[data-panel]").forEach(btn => {
    btn.addEventListener("click", () => toggleRefPanel(btn.dataset.panel));
  });

  const markBtn = document.getElementById("markBtn");
  if (markBtn) markBtn.addEventListener("click", toggleComplete);
  const prevBtn = document.getElementById("prevBtn");
  if (prevBtn) prevBtn.addEventListener("click", prevDay);
  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn) nextBtn.addEventListener("click", nextDay);
  const timerToggle = document.getElementById("timerToggle");
  if (timerToggle) timerToggle.addEventListener("click", () => { timerInterval ? stopTimer() : startTimer(); updateTimerUI(); });
  const timerResetBtn = document.getElementById("timerResetBtn");
  if (timerResetBtn) timerResetBtn.addEventListener("click", () => { resetTimer(); updateTimerUI(); });

  const metroToggle = document.getElementById("metroToggle");
  if (metroToggle) metroToggle.addEventListener("click", () => { metronomeRunning ? stopMetronome() : startMetronome(); });
  const metroUp = document.getElementById("metroUp");
  if (metroUp) metroUp.addEventListener("click", () => changeMetronomeBpm(5));
  const metroDown = document.getElementById("metroDown");
  if (metroDown) metroDown.addEventListener("click", () => changeMetronomeBpm(-5));

  const notesArea = document.getElementById("sessionNotes");
  if (notesArea) notesArea.addEventListener("input", (e) => updateNote(e.target.value));
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = page === "home" ? renderHome() : renderDetail();
  bindEvents();
  if (page === "detail") updateTimerUI();
  window.scrollTo(0, 0);
}

loadProgress();
render();
</script>
</body>
</html>
