    --maroon:  #E62E2E;
    --maroon-lt:#FF4B4B;
    --bg:      #F4F0FF;
    --surface: #FFFFFF;
    --card:    #FFFFFF;
    --card-h:  #F4F0FF;
    --border:  #D8CEF0;
    --text:    #2D2640;
    --muted:   #6B5E8A;
    --faint:   #9384B0;
    --violet:  #7C3AED;
    --violet-lt:#9D5CF5;
    --green:   #58CC02;
    --green-lt: #78D82D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(124,58,237,0.08), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(28,176,246,0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HOME + TITLE — hardcoded to match Flag Atlas's own save-btn/h1 exactly ── */
  .fa-header-badges{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px}
  .fa-home-btn{
    display:flex;align-items:center;justify-content:center;gap:5px;
    background:#7C3AED;border:2px solid #5B21B6;
    box-shadow:0 3px 0 #5B21B6;border-radius:999px;padding:7px 14px;
    font-family:'Nunito','Segoe UI',sans-serif;font-weight:800;font-size:12px;color:#fff;
    flex-shrink:0;cursor:pointer;transition:transform .1s;min-width:74px;height:34px;
  }
  .fa-home-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5B21B6}
  .fa-save-btn{background:#FFC800;border-color:#C79200;box-shadow:0 3px 0 #C79200;color:#2D2640}
  .fa-save-btn:active{box-shadow:0 1px 0 #C79200}
  .topic-bookmark-btn{position:absolute;top:0;right:0;width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--border);box-shadow:0 3px 0 var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
  .topic-bookmark-btn.active{background:#FFF6D8;border-color:#F0B300;box-shadow:0 3px 0 #F0B300}
  .saved-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px;font-weight:600}
  .saved-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--border);border-radius:14px;margin-bottom:10px;cursor:pointer;background:var(--surface)}
  .saved-row-info{flex:1;min-width:0}
  .saved-row-title{font-weight:800;font-size:13.5px;color:var(--text)}
  .saved-row-sub{font-size:11.5px;color:var(--muted);font-weight:600}
  .saved-remove-btn{font-size:18px;background:none;border:none;cursor:pointer;flex-shrink:0;padding:4px;line-height:1}
  .fa-h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(24px,7vw,32px);color:#2D2640;letter-spacing:-.01em;margin:0}

  /* ── HEADER ── */
  .header {
    position: sticky; top: 0; z-index: 200;
    background: rgba(13,15,26,0.97);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; height: 62px;
  }
  .logo {
    font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px;
    color: var(--violet-lt);
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
    text-shadow: 0 0 20px rgba(124,58,237,0.5);
  }
  .logo-sym { animation: pulse 3s ease-in-out infinite; display: inline-block; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.7;transform:scale(0.92)} }

  .header-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .hpill {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 12px;
    font-size: 0.76rem; font-weight: 600; color: var(--muted);
    display: flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .hpill b { color: var(--teal-lt); }

  .header-actions { display: flex; gap: 8px; }
  .hbtn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px; padding: 6px 13px;
    cursor: pointer; font-size: 0.8rem; font-weight: 700;
    transition: all 0.18s; white-space: nowrap; font-family: inherit;
  }
  .hbtn:hover { border-color: var(--violet-lt); color: var(--violet-lt); }
  .hbtn.danger:hover { border-color: var(--brick); color: var(--brick); }
  .hbtn.save-anim { border-color: var(--teal-lt); color: var(--teal-lt); }
  .hbtn.quickquiz {
    background: linear-gradient(135deg, rgba(124,58,237,0.18), rgba(28,176,246,0.18));
    border-color: var(--violet);
    color: var(--violet-lt);
  }
  .hbtn.quickquiz:hover {
    background: linear-gradient(135deg, rgba(124,58,237,0.32), rgba(28,176,246,0.32));
    border-color: var(--violet-lt);
    color: #fff;
    box-shadow: 0 0 14px rgba(124,58,237,0.35);
  }

  /* ── HERO ── */
  .hero {
    text-align: center;
    padding: 52px 20px 36px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 600px; height: 600px;
    background: radial-gradient(ellipse at center, rgba(124,58,237,0.13) 0%, rgba(28,176,246,0.06) 45%, transparent 70%);
    pointer-events: none;
  }
  .hero-eyebrow {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
    color: var(--violet-lt); margin-bottom: 16px;
  }
  .hero-title {
    font-size: clamp(2rem, 5vw, 3.6rem); font-weight: 800;
    line-height: 1.08; letter-spacing: -1.5px;
    margin-bottom: 14px; color: var(--cream);
  }
  .hero-title em { color: var(--teal-lt); font-style: normal; text-shadow: 0 0 28px rgba(34,211,238,0.4); }
  .hero-sub {
    font-family: 'Lora', serif; font-style: italic;
    font-size: 1rem; color: var(--muted); max-width: 420px; margin: 0 auto 28px;
    line-height: 1.7;
  }
  .progress-row { display: flex; align-items: center; gap: 12px; margin: 4px auto 20px; }
  .progress-track { flex: 1; height: 8px; background: var(--surface); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
  .progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--violet), var(--teal-lt)); transition: width 0.4s ease; }
  .progress-label { font-size: 0.72rem; font-weight: 700; color: var(--muted); white-space: nowrap; }

  /* Quiz banner card — copied from Flag Match's dashboard card */
  .quiz-banner {
    max-width: 420px; margin: 0 auto 30px; border-radius: 20px; padding: 22px;
    background: linear-gradient(135deg, var(--violet), var(--teal));
    color: #fff; text-align: center; position: relative; overflow: hidden;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
  }
  .quiz-banner::before {
    content: '⚡'; position: absolute; top: 8px; right: 14px;
    font-size: 46px; opacity: 0.18; line-height: 1;
  }
  .quiz-banner-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; font-family: var(--font-display); }
  .quiz-banner-sub { font-size: 12.5px; opacity: 0.92; margin-bottom: 16px; font-weight: 700; }
  .quiz-banner-btn {
    background: #fff; color: var(--violet); border: none; border-radius: 12px;
    padding: 11px 22px; font-family: var(--font-display); font-weight: 800;
    font-size: 0.9rem; cursor: pointer; transition: all .18s;
  }
  .quiz-banner-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.2); }
  .quiz-banner-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .hero-stats {
    display: inline-flex; gap: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden;
  }
  .hstat {
    padding: 10px 22px; font-size: 0.8rem; font-weight: 600; color: var(--muted);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .hstat:last-child { border-right: none; }
  .hstat big { font-size: 1.4rem; font-weight: 800; color: var(--teal-lt); line-height: 1; }

  /* ── FILTERS ── */
  .filters {
    display: flex; flex-wrap: wrap; gap: 7px;
    max-width: 1100px; margin: 0 auto 28px;
    padding: 0 20px;
    justify-content: center;
  }
  .fchip {
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); border-radius: 20px; padding: 5px 13px;
    font-size: 0.76rem; font-weight: 700; cursor: pointer;
    transition: all 0.18s; font-family: inherit;
  }
  .fchip:hover { border-color: var(--violet-lt); color: var(--violet-lt); }
  .fchip.active { background: var(--violet); color: #fff; border-color: var(--violet); }

  /* ── PHASES (months), copied from Rubik's / Flag Atlas's path view ── */
  .grid-wrap { max-width: 760px; margin: 0 auto; padding: 0 18px 100px; }
  .months-list { display: flex; flex-direction: column; gap: 26px; margin-top: 6px; }
  .chapter-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    background: var(--chap-color, var(--violet)); border-radius: 16px;
    padding: 14px 18px; box-shadow: 0 3px 0 rgba(0,0,0,0.15);
    width: 100%; border: none; cursor: pointer;
  }
  .chapter-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #fff; flex-shrink: 0; }
  .chapter-title { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -.01em; flex: 1; text-align: left; font-family: var(--font-display); }
  .chapter-sub { font-size: 11.5px; color: rgba(255,255,255,0.88); font-weight: 700; white-space: nowrap; }
  .chapter-arrow { color: rgba(255,255,255,0.85); font-size: 12px; transition: transform .18s; }
  .chapter-header.collapsed .chapter-arrow { transform: rotate(-90deg); }

  .day-path { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 12px 6px; padding: 14px 4px 4px; }
  .day-node {
    aspect-ratio: 1; width: 100%; border-radius: 50%;
    border: 2.5px solid var(--border); background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative; transition: transform .12s, box-shadow .12s;
    gap: 1px; padding: 2px; font-family: inherit;
  }
  .day-node:not(:disabled):active { transform: translateY(2px); }
  .day-node.locked {
    background: rgba(216,206,240,0.25); border-color: var(--border);
    cursor: not-allowed; opacity: 0.55;
  }
  .day-node.unlocked { background: var(--card); border-color: var(--violet); }
  .day-node.unlocked:hover {
    background: var(--card-h); border-color: var(--violet-lt);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.18);
  }
  .day-node.partial { background: rgba(255,75,75,0.1); border-color: var(--brick); }
  .day-node.partial:hover { box-shadow: 0 0 0 3px rgba(255,75,75,0.18); }
  .day-node.done { background: rgba(255,200,0,0.12); border-color: var(--amber); }
  .day-node.done:hover { box-shadow: 0 0 0 3px rgba(255,200,0,0.22); }
  .day-node.perfect { background: rgba(88,204,2,0.14); border-color: var(--green); }
  .day-node.perfect:hover { box-shadow: 0 0 0 3px rgba(88,204,2,0.22); }

  .dc-num { font-size: 0.66rem; font-weight: 800; color: var(--faint); line-height: 1; }
  .day-node.unlocked .dc-num, .day-node.partial .dc-num { color: var(--violet); }
  .day-node.done .dc-num { color: var(--amber-lt); }
  .day-node.perfect .dc-num { color: var(--green); }
  .dc-icon { font-size: 1.05rem; line-height: 1; }
  .dc-score {
    position: absolute; bottom: -7px; font-size: 0.5rem; font-weight: 800; padding: 0px 5px;
    border-radius: 8px; background: rgba(255,200,0,0.18); color: var(--amber-lt);
    letter-spacing: 0.3px; white-space: nowrap;
  }
  .day-node.perfect .dc-score { background: rgba(88,204,2,0.2); color: var(--green); }
  .day-node.partial .dc-score { background: rgba(255,75,75,0.18); color: var(--brick); }
  .dc-lock { font-size: 0.7rem; color: var(--faint); opacity: 0.6; }

  /* ── MODAL BG ── */
  .modal-bg {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(10,5,6,0.92);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-bg.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px; width: 100%; max-width: 580px;
    max-height: 92vh; overflow-y: auto;
    transform: translateY(18px) scale(0.98);
    transition: transform 0.25s;
    box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(124,58,237,0.1);
  }
  .modal-bg.open .modal { transform: translateY(0) scale(1); }

  /* Modal – Topic Tabs */
  .modal-tabs {
    display: flex; border-bottom: 1px solid var(--border);
    padding: 0 20px;
    gap: 0;
    overflow-x: auto;
  }
  .mtab {
    padding: 14px 14px 12px; font-size: 0.78rem; font-weight: 700;
    color: var(--faint); cursor: pointer; border-bottom: 2px solid transparent;
    transition: all 0.18s; white-space: nowrap; position: relative;
    display: flex; align-items: center; gap: 6px;
    flex-shrink: 0;
  }
  .mtab:hover { color: var(--muted); }
  .mtab.active { color: var(--violet-lt); border-bottom-color: var(--violet-lt); }
  .mtab.completed-tab { color: var(--teal-lt); }
  .mtab.completed-tab.active { border-bottom-color: var(--teal-lt); }
  .tab-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--violet-lt); flex-shrink: 0; display: none;
  }
  .mtab.completed-tab .tab-dot { display: block; background: var(--teal-lt); }
  .mtab.partial-tab .tab-dot { display: block; background: var(--brick); }

  /* Modal – Day Header */
  .modal-dheader {
    padding: 20px 20px 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  }
  .modal-day-badge {
    font-size: 0.68rem; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
    color: var(--violet-lt); background: rgba(124,58,237,0.12); border-radius: 7px;
    padding: 3px 9px; margin-bottom: 6px; display: inline-block;
  }
  .modal-title {
    font-size: 1.55rem; font-weight: 800; letter-spacing: -0.5px; line-height: 1.15;
    margin-bottom: 3px; color: var(--cream);
  }
  .modal-cat { font-size: 0.78rem; color: var(--muted); }
  .mclose {
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); border-radius: 9px; padding: 7px 10px;
    cursor: pointer; font-size: 1rem; line-height: 1; flex-shrink: 0;
    transition: all 0.15s; font-family: inherit;
  }
  .mclose:hover { color: var(--cream); border-color: var(--muted); }

  .modal-icon { font-size: 3.2rem; text-align: center; padding: 16px 0 4px; }

  /* Topic panel */
  .topic-panel { padding: 0 20px 20px; display: none; position: relative; }
  .topic-panel.active { display: block; }

  .fact-box {
    font-family: 'Lora', serif; font-size: 0.92rem; line-height: 1.78;
    color: var(--cream-dk);
    background: var(--card); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 18px;
    border-left: 3px solid var(--violet-lt);
  }
  .kp-head {
    font-size: 0.68rem; font-weight: 800; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--faint); margin-bottom: 10px;
  }
  .kp-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 20px; }
  .kp-item {
    display: flex; gap: 10px; font-size: 0.87rem; color: var(--muted); line-height: 1.5;
  }
  .kp-dot { color: var(--violet-lt); flex-shrink: 0; margin-top: 1px; font-size: 0.7rem; }

  .quiz-cta {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--violet), var(--teal));
    color: #fff;
    border: none; border-radius: 12px; cursor: pointer;
    font-family: var(--font-display); font-size: 1rem; font-weight: 800;
    transition: all 0.18s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 20px rgba(124,58,237,0.3);
  }
  .quiz-cta:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); box-shadow: 0 6px 28px rgba(124,58,237,0.45); }
  .quiz-cta:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
  .quiz-cta.retry { background: transparent; border: 1.5px solid var(--violet-lt); color: var(--violet-lt); box-shadow: none; }
  .quiz-cta.retry:hover { background: rgba(124,58,237,0.12); }

  /* Quiz */
  .quiz-panel { padding: 0 20px 20px; display: none; }
  .quiz-panel.active { display: block; }

  .qprogrow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .qplabel { font-size: 0.72rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); }
  .qpscore { font-size: 0.82rem; font-weight: 800; color: var(--teal-lt); }
  .pbar { height: 3px; background: var(--card); border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
  .pfill { height: 100%; background: linear-gradient(90deg, var(--violet), var(--teal-lt)); transition: width 0.4s ease; border-radius: 3px; }

  .qtext {
    font-size: 1rem; font-weight: 700; line-height: 1.45;
    color: var(--cream); margin-bottom: 16px;
  }
  .opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .opt {
    background: var(--card); border: 1.5px solid var(--border);
    color: var(--muted); border-radius: 11px; padding: 12px 14px;
    text-align: left; cursor: pointer; font-size: 0.87rem; font-weight: 600;
    transition: all 0.14s; font-family: inherit; line-height: 1.4;
    display: flex; align-items: center; gap: 10px;
  }
  .opt:hover:not(:disabled) { border-color: var(--violet-lt); color: var(--cream); background: var(--card-h); }
  .opt.correct { background: rgba(28,176,246,0.12); border-color: var(--teal-lt); color: var(--teal-lt); }
  .opt.wrong { background: rgba(255,75,75,0.12); border-color: var(--brick); color: var(--brick); }
  .opt:disabled { cursor: not-allowed; }
  .oletter {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    background: var(--border); display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 800; color: var(--faint);
  }
  .opt.correct .oletter { background: var(--teal); color: #fff; }
  .opt.wrong .oletter { background: var(--brick-dk); color: #fff; }

  .fbbox {
    background: var(--card); border-radius: 10px; padding: 12px 14px;
    font-size: 0.83rem; line-height: 1.55; color: var(--muted);
    margin-bottom: 12px; display: none; border-left: 3px solid var(--teal-lt);
    font-family: 'Lora', serif; font-style: italic;
  }
  .fbbox.show { display: block; }
  .fbbox.correct-fb { background: rgba(88,204,2,0.12); border-left-color: var(--green); color: var(--cream); }
  .fbbox.wrong-fb { background: rgba(255,75,75,0.1); border-left-color: var(--brick); color: var(--cream); }

  /* Pip progress row — copied from Flag Match's per-question pips */
  .qq-pips { display: flex; gap: 5px; flex: 1; justify-content: center; flex-wrap: wrap; }
  .qq-pip { width: 18px; height: 8px; border-radius: 999px; background: var(--border); transition: background .3s; }
  .qq-pip.done { background: var(--amber); }
  .qq-pip.current { background: var(--violet-lt); }

  /* Star rating — copied from Flag Match's result screen */
  .qq-stars { display: flex; gap: 4px; justify-content: center; margin-bottom: 6px; }
  .qq-star { font-size: 30px; }


  .nextbtn {
    width: 100%; padding: 12px;
    background: transparent; border: 1.5px solid var(--border);
    color: var(--muted); border-radius: 11px; cursor: pointer;
    font-family: var(--font-display); font-size: 0.9rem; font-weight: 700;
    transition: all 0.18s; display: none;
  }
  .nextbtn.show { display: block; }
  .nextbtn:hover { border-color: var(--violet-lt); color: var(--violet-lt); }

  /* Result */
  .result-panel {
    text-align: center; padding: 24px 20px;
    display: none;
  }
  .result-panel.show { display: block; }
  .re-emoji { font-size: 3.5rem; margin-bottom: 10px; }
  .re-title { font-size: 1.5rem; font-weight: 800; color: var(--cream); margin-bottom: 6px; }
  .re-score {
    font-size: 0.92rem; color: var(--muted); margin-bottom: 6px;
    font-family: 'Lora', serif; font-style: italic;
  }
  .re-score strong { color: var(--teal-lt); font-size: 1.8rem; font-style: normal; font-family: var(--font-display); }
  .re-msg { font-size: 0.82rem; color: var(--faint); margin-bottom: 22px; }
  .re-actions { display: flex; gap: 10px; }
  .btn-sec {
    flex: 1; padding: 12px; background: var(--card); border: 1.5px solid var(--border);
    color: var(--muted); border-radius: 11px; cursor: pointer;

// STATE
// ═══════════════════════════════════════════════════════════
const LS_KEY = 'k365v3';
let DEV_MODE = false;
let state = loadState();

function defaultState() { return { highestUnlocked: 1, completed: {}, bookmarks: {} }; }

// One-time repair for saves created by an older version of this app, where a
// day's quiz only ever recorded a single topic's completion entry instead of
// one entry per topic. That made dayCompleted() permanently false for any day
// with more than one topic, which in turn meant the NEXT day could never
// unlock — even though the person had genuinely finished the quiz. If a day
// is below the player's highestUnlocked (meaning they passed it once, under
// whatever code was running then) but is still missing a completion entry
// for one of its topics, backfill that topic as a full-score entry so the
// day reads as complete and progress can move forward again.
function migrateState(s) {
  if (!s || typeof s !== 'object') return defaultState();
  if (typeof s.highestUnlocked !== 'number' || s.highestUnlocked < 1) s.highestUnlocked = 1;
  if (!s.completed || typeof s.completed !== 'object') s.completed = {};
  if (!s.bookmarks || typeof s.bookmarks !== 'object') s.bookmarks = {};

  for (let d = 1; d < s.highestUnlocked; d++) {
    const dayDef = allDays[d - 1];
    if (!dayDef) continue;
    if (!s.completed[d]) s.completed[d] = {};
    dayDef.topics.forEach((t, i) => {
      if (!s.completed[d][i]) {
        const max = t.q ? t.q.length : 2;
        s.completed[d][i] = { score: max, max };
      }
    });
  }
  return s;
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    const s = raw ? JSON.parse(raw) : defaultState();
    return migrateState(s);
  } catch { return defaultState(); }
}
function saveState() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }

function saveProgress() {
  saveState();
  const btn = document.getElementById('save-btn');
  btn.classList.add('save-anim');
  btn.textContent = '✓ Saved!';
  showToast('✓ Progress saved!');
  setTimeout(() => { btn.classList.remove('save-anim'); btn.textContent = '💾 Save'; }, 2000);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function confirmReset() { document.getElementById('confirm-bg').classList.add('open'); }
function closeConfirm() { document.getElementById('confirm-bg').classList.remove('open'); }
function doReset() {
  state = defaultState();
  saveState();
  closeConfirm();
  showToast('↺ Progress reset.');
  render();
}

// HELPERS
// ═══════════════════════════════════════════════════════════
function isUnlocked(d) { return DEV_MODE || d <= state.highestUnlocked; }
function dayCompleted(d) {
  const c = state.completed[d];
  if (!c) return false;
  return allDays[d - 1].topics.every((_, i) => c[i]);
}
function dayPerfect(d) {
  const c = state.completed[d];
  if (!c) return false;
  return allDays[d - 1].topics.every((t, i) => c[i] && c[i].score === c[i].max);
}
function dayPartial(d) {
  const c = state.completed[d];
  if (!c) return false;
  return allDays[d - 1].topics.some((_, i) => c[i]) && !dayCompleted(d);
}
function topicDone(d, ti) { return !!(state.completed[d] && state.completed[d][ti]); }
function bookmarkKey(d, ti) { return d + '-' + ti; }
function isBookmarked(d, ti) { return !!(state.bookmarks && state.bookmarks[bookmarkKey(d, ti)]); }
function toggleBookmark(d, ti) {
  if (!state.bookmarks) state.bookmarks = {};
  const key = bookmarkKey(d, ti);
  if (state.bookmarks[key]) delete state.bookmarks[key];
  else state.bookmarks[key] = { day: d, ti: ti, title: allDays[d - 1].topics[ti].title, icon: allDays[d - 1].topics[ti].icon };
  saveState();
  updateSavedBtn();
}
function bookmarkList() {
  return Object.values(state.bookmarks || {}).sort((a, b) => a.day - b.day || a.ti - b.ti);
}
function updateSavedBtn() {
  const btn = document.getElementById('openSavedBtn');
  if (!btn) return;
  const n = bookmarkList().length;
  btn.textContent = n ? `🔖 Saved (${n})` : '🔖 Saved';
}
function topicPerfect(d, ti) {
  const r = state.completed[d]?.[ti];
  return r && r.score === r.max;
}
function dayScore(d) {
  const c = state.completed[d];
  if (!c) return null;
  let score = 0, max = 0;
  allDays[d - 1].topics.forEach((t, i) => {
    if (c[i]) { score += c[i].score; max += c[i].max; }
  });
  return { score, max };
}

// ═══════════════════════════════════════════════════════════
// HEADER
// ═══════════════════════════════════════════════════════════
function updateHeader() {
  let unlockedTopics = 0;
  for (let d = 1; d <= state.highestUnlocked; d++) unlockedTopics += allDays[d - 1].topics.length;
  const sub = document.getElementById('quiz-banner-sub');
  if (sub) sub.textContent = `5 random questions · multiple choice · from your ${unlockedTopics} unlocked topic${unlockedTopics === 1 ? '' : 's'}`;
}

// ═══════════════════════════════════════════════════════════
// FILTER — no category chips; always show all days
// ═══════════════════════════════════════════════════════════
let activeFilter = 'all';
function dayMatchesFilter(d) { return true; }

// ═══════════════════════════════════════════════════════════
// RENDER PHASES — one phase per calendar month (365 days ÷ 12
// months), collapsible chapter headers + circular day-path nodes,
// copied from Rubik's Cube / Flag Atlas's own path view.
// ═══════════════════════════════════════════════════════════
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS_PER_MONTH = [31,28,31,30,31,30,31,31,30,31,30,31];
const PHASE_COLORS = ['var(--violet)','var(--teal)','var(--brick)','var(--green)'];

function buildMonthPhases() {
  const months = [];
  let dayCursor = 1;
  for (let m = 0; m < 12; m++) {
    const days = [];
    for (let i = 0; i < DAYS_PER_MONTH[m] && dayCursor <= 365; i++) { days.push(dayCursor); dayCursor++; }
    months.push({ id: m + 1, title: MONTHS[m], color: PHASE_COLORS[m % PHASE_COLORS.length], days });
  }
  return months;
}
const MONTH_PHASES = buildMonthPhases();

// Lazily initialized so the default expand state can react to
// wherever the player currently is (only that month starts open).
let collapsedMonths = null;

function toggleMonth(id) {
  if (collapsedMonths.has(id)) collapsedMonths.delete(id);
  else collapsedMonths.add(id);
  renderGrid();
}

function renderGrid() {
  if (!collapsedMonths) {
    const current = MONTH_PHASES.find(mo => mo.days.includes(state.highestUnlocked)) || MONTH_PHASES[0];
    collapsedMonths = new Set(MONTH_PHASES.filter(mo => mo.id !== current.id).map(mo => mo.id));
  }

  const list = document.getElementById('months-list');
  list.innerHTML = '';

  MONTH_PHASES.forEach(month => {
    const doneInMonth = month.days.filter(d => dayCompleted(d)).length;
    const collapsed = collapsedMonths.has(month.id);

    const section = document.createElement('div');

    const header = document.createElement('button');
    header.type = 'button';
    header.className = 'chapter-header' + (collapsed ? ' collapsed' : '');
    header.style.setProperty('--chap-color', month.color);
    header.innerHTML = `<span class="chapter-dot"></span>
      <span class="chapter-title">Phase ${month.id} · ${month.title}</span>
      <span class="chapter-sub">${doneInMonth}/${month.days.length}</span>
      <span class="chapter-arrow">▾</span>`;
    header.onclick = () => toggleMonth(month.id);
    section.appendChild(header);

    if (!collapsed) {
      const path = document.createElement('div');
      path.className = 'day-path';
      month.days.forEach(d => {
        if (!dayMatchesFilter(d)) return;

        const unlocked = isUnlocked(d);
        const done = dayCompleted(d);
        const perfect = dayPerfect(d);
        const partial = dayPartial(d);
        const s = dayScore(d);
        const topic0 = allDays[d - 1].topics[0];

        let cls = 'day-node';
        if (perfect) cls += ' perfect';
        else if (done) cls += ' done';
        else if (partial) cls += ' partial';
        else if (unlocked) cls += ' unlocked';
        else cls += ' locked';

        const node = document.createElement('button');
        node.type = 'button';
        node.className = cls;
        node.disabled = !unlocked;
        if (unlocked) node.onclick = () => openDay(d);

        let inner = `<span class="dc-num">${d}</span>`;
        if (unlocked) {
          inner += `<span class="dc-icon">${topic0.icon}</span>`;
          if (s) inner += `<span class="dc-score">${s.score}/${s.max}</span>`;
        } else {
          inner += `<span class="dc-lock">🔒</span>`;
        }
        node.innerHTML = inner;
        path.appendChild(node);
      });
      section.appendChild(path);
    }

    list.appendChild(section);
  });

  const unlockedDay = Math.min(state.highestUnlocked, 365);
  const fill = document.getElementById('overall-progress-fill');
  const label = document.getElementById('overall-progress-label');
  if (fill) fill.style.width = ((unlockedDay - 1) / 365 * 100) + '%';
  if (label) label.textContent = `Day ${unlockedDay} of 365`;
}

// ═══════════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════════
let activeDay = null;
let activeTopicIdx = null;
let quizState = null;

function openDay(dayNum) {
  activeDay = dayNum;
  activeTopicIdx = 0;
  const d = allDays[dayNum - 1];
  const totalQ = d.topics.reduce((sum, t) => sum + t.q.length, 0);
  document.getElementById('m-daybadge').textContent = `Day ${dayNum}`;
  document.getElementById('m-dayinfo').textContent = `${d.topics.length} topics · ${totalQ} questions total`;
  // Reset panel visibility every time a day is opened. startDayQuiz() sets
  // modal-content to display:none via inline style while the quiz runs; if a
  // day is closed right after finishing a quiz, that inline style sticks
  // around on the (shared, never-recreated) #modal-content element. The next
  // day opened would then have its topic content silently hidden — tabs and
  // day info still render fine since those are separate elements, making it
  // look like "only the header" loaded.
  document.getElementById('modal-content').style.display = '';
  document.getElementById('quiz-panel').style.display = 'none';
  document.getElementById('quiz-panel').classList.remove('active');
  document.getElementById('result-panel').style.display = 'none';
  document.getElementById('result-panel').classList.remove('show');
  buildTabs(dayNum);
  showTopicPanel(0);
  document.getElementById('modal-bg').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function buildTabs(dayNum) {
  const d = allDays[dayNum - 1];
  const tabsEl = document.getElementById('modal-tabs');
  tabsEl.innerHTML = d.topics.map((t, i) => {
    let cls = 'mtab';
    if (topicPerfect(dayNum, i)) cls += ' completed-tab';
    else if (topicDone(dayNum, i)) cls += ' partial-tab';
    // Strip "IT Acronyms: " prefix so tab just shows the acronym pair
    const tabLabel = t.title.replace(/^IT Acronyms:\s*/i, '');
    return `<div class="${cls}" id="tab-${i}" onclick="switchTab(${i})">
      <span class="tab-dot"></span>${t.icon} ${tabLabel}
    </div>`;
  }).join('');
}

function switchTab(ti) {
  activeTopicIdx = ti;
  showTopicPanel(ti);
}

function showTopicPanel(ti) {
  activeTopicIdx = ti;
  const d = allDays[activeDay - 1];
  const t = d.topics[ti];

  document.querySelectorAll('.mtab').forEach((el, i) => {
    el.classList.toggle('active', i === ti);
  });

  const alreadyDone = dayCompleted(activeDay);
  const content = document.getElementById('modal-content');
  content.style.display = '';
  content.innerHTML = `
    <div class="modal-icon">${t.icon}</div>
    <div class="topic-panel active" id="topic-panel-${ti}">
      <button type="button" class="topic-bookmark-btn${isBookmarked(activeDay, ti) ? ' active' : ''}" id="topicBookmarkBtn" title="${isBookmarked(activeDay, ti) ? 'Remove bookmark' : 'Bookmark this topic'}">${isBookmarked(activeDay, ti) ? '⭐' : '☆'}</button>
      <div class="fact-box">${t.fact}</div>
      <div class="kp-head">Key Points</div>
      <div class="kp-list">${t.kps.map(k => `<div class="kp-item"><span class="kp-dot">◆</span>${k}</div>`).join('')}</div>
      ${ti < d.topics.length - 1
        ? `<button class="quiz-cta" style="background:var(--teal);color:var(--cream)" onclick="switchTab(${ti + 1})">Next Topic: ${d.topics[ti + 1].title} →</button>`
        : `<button class="quiz-cta ${alreadyDone ? 'retry' : ''}" onclick="startDayQuiz()">
            ${alreadyDone ? '🔄 Retry Day Quiz (8 Qs)' : '🎯 Start Day Quiz (8 Qs)'}
           </button>`
      }
    </div>`;

  document.getElementById('quiz-panel').style.display = 'none';
  document.getElementById('result-panel').style.display = 'none';
  document.getElementById('result-panel').classList.remove('show');

  const bmBtn = document.getElementById('topicBookmarkBtn');
  if (bmBtn) bmBtn.addEventListener('click', () => {
    toggleBookmark(activeDay, ti);
    showTopicPanel(ti);
    showToast(isBookmarked(activeDay, ti) ? '⭐ Bookmarked!' : 'Bookmark removed');
  });
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
  document.body.style.overflow = '';
  activeDay = null;
  render();
}
function closeModalBg(e) {
  if (e.target === document.getElementById('modal-bg')) closeModal();
}

// ═══════════════════════════════════════════════════════════
// QUIZ — continuous day quiz across all 4 topics
// ═══════════════════════════════════════════════════════════
function startDayQuiz() {
  const d = allDays[activeDay - 1];
  // Flatten all questions from all topics, tagging each with its topic index
  const allQs = [];
  d.topics.forEach((t, ti) => {
    t.q.forEach(q => allQs.push({ ...q, _ti: ti }));
  });
  quizState = { qs: allQs, cur: 0, score: 0, answered: false, results: [] };

  document.getElementById('modal-content').style.display = 'none';
  document.getElementById('quiz-panel').style.display = 'block';
  document.getElementById('result-panel').style.display = 'none';
  document.getElementById('result-panel').classList.remove('show');

  renderQ();
}

// Keep startQuiz as alias for retry from result panel
function startQuiz() { startDayQuiz(); }

function renderQ() {
  const { qs, cur, score } = quizState;
  const total = qs.length;
  document.getElementById('q-scorelive').textContent = `${score}/${cur}`;
  document.getElementById('q-fill').style.width = `${(cur / total) * 100}%`;

  const q = qs[cur];
  const d = allDays[activeDay - 1];
  const topicName = d.topics[q._ti].title.replace(/^IT Acronyms:\s*/i, '');
  document.getElementById('q-text').innerHTML =
    `<span style="font-size:0.7rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:6px">${d.topics[q._ti].icon} ${topicName}</span>` +
    `Q${cur + 1}/${total}: ${q.q}`;

  const letters = ['A','B','C','D'];
  document.getElementById('q-opts').innerHTML = q.o.map((opt, i) =>
    `<button class="opt" onclick="answerQ(${i})">
       <span class="oletter">${letters[i]}</span>${opt}
     </button>`
  ).join('');

  document.getElementById('q-fb').className = 'fbbox';
  document.getElementById('q-next').className = 'nextbtn';
  document.getElementById('q-next').textContent = cur + 1 >= total ? 'See Results →' : 'Next →';
  quizState.answered = false;
}

function answerQ(chosen) {
  if (quizState.answered) return;
  quizState.answered = true;
  const q = quizState.qs[quizState.cur];
  const correct = chosen === q.a;
  if (correct) quizState.score++;
  quizState.results[quizState.cur] = correct;

  document.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === chosen && !correct) b.classList.add('wrong');
  });

  const fb = document.getElementById('q-fb');
  fb.textContent = (correct ? '✓ Correct! ' : '✗ Not quite. ') + q.e;
  fb.className = 'fbbox show' + (!correct ? ' wrong-fb' : '');

  document.getElementById('q-scorelive').textContent =
    `${quizState.score}/${quizState.cur + 1}`;
  document.getElementById('q-next').className = 'nextbtn show';
}

function nextQ() {
  quizState.cur++;
  if (quizState.cur >= quizState.qs.length) showResult();
  else renderQ();
}

function showResult() {
  const { score, qs } = quizState;
  const max = qs.length;
  const pct = score / max;

  document.getElementById('quiz-panel').style.display = 'none';
  const rp = document.getElementById('result-panel');
  rp.style.display = 'block';
  rp.classList.add('show');

  let emoji, title;
  if (pct === 1) { emoji = '🏆'; title = 'Perfect Score!'; }
  else if (pct >= 0.5) { emoji = '👍'; title = 'Good Job!'; }
  else { emoji = '📚'; title = 'Keep Learning!'; }

  document.getElementById('re-emoji').textContent = emoji;
  document.getElementById('re-title').textContent = title;
  document.getElementById('re-score').innerHTML = `Score: <strong>${score}/${max}</strong>`;

  document.getElementById('re-msg').textContent = 'All topics done for today! 🎉';

  const nextBtn = document.querySelector('#result-panel .btn-pri');
  nextBtn.textContent = '✓ Done';
  nextBtn.onclick = closeModal;

  // The day quiz spans every topic's questions in one run (each question is
  // tagged with its topic index via _ti). Tally per-topic score/max from the
  // flattened question set so EVERY topic gets a completion record — not just
  // whichever tab happened to be active when the quiz was started. This is
  // what actually unlocks the next day, since dayCompleted() requires every
  // topic index to have an entry.
  if (!state.completed[activeDay]) state.completed[activeDay] = {};
  const perTopic = {};
  qs.forEach((q, i) => {
    if (!perTopic[q._ti]) perTopic[q._ti] = { score: 0, max: 0 };
    perTopic[q._ti].max++;
    if (quizState.results[i]) perTopic[q._ti].score++;
  });
  Object.keys(perTopic).forEach(idx => {
    const prev = state.completed[activeDay][idx];
    const next = perTopic[idx];
    if (!prev || next.score > prev.score) {
      state.completed[activeDay][idx] = next;
    }
  });

  if (dayCompleted(activeDay) && activeDay === state.highestUnlocked && activeDay < 365) {
    state.highestUnlocked = activeDay + 1;
  }
  saveState();
  updateHeader();
  buildTabs(activeDay);
}

function retryQuiz() {
  document.getElementById('modal-content').style.display = '';
  document.getElementById('result-panel').style.display = 'none';
  document.getElementById('result-panel').classList.remove('show');
  startQuiz(activeTopicIdx);
}

function nextTopicOrClose() {
  const d = allDays[activeDay - 1];
  const nextTi = activeTopicIdx + 1;
  if (nextTi < d.topics.length) {
    document.getElementById('modal-content').style.display = '';
    document.getElementById('result-panel').style.display = 'none';
    document.getElementById('result-panel').classList.remove('show');
    showTopicPanel(nextTi);
  } else {
    closeModal();
  }
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
function render() { updateHeader(); renderGrid(); }
render();

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('confirm-bg').classList.contains('open')) closeConfirm();
    else closeModal();
  }
});

// ═══════════════════════════════════════════════════════════
// QUICK QUIZ — 5 random questions from all unlocked days
// ═══════════════════════════════════════════════════════════
let qqState = null;

function openQuickQuiz() {
  // Gather all questions from unlocked days
  const pool = [];
  for (let d = 1; d <= state.highestUnlocked; d++) {
    allDays[d - 1].topics.forEach((t, ti) => {
      t.q.forEach(q => pool.push({ ...q, _day: d, _ti: ti, _icon: t.icon, _title: t.title }));
    });
  }
  // Shuffle and pick 5
  const shuffled = pool.sort(() => Math.random() - 0.5).slice(0, Math.min(5, pool.length));
  qqState = { qs: shuffled, cur: 0, score: 0, answered: false, results: [] };

  document.getElementById('qq-panel').style.display = 'block';
  document.getElementById('qq-result-panel').style.display = 'none';
  document.getElementById('qq-result-panel').classList.remove('show');
  document.getElementById('qq-modal-bg').classList.add('open');
  document.body.style.overflow = 'hidden';
  qqRenderQ();
}

function closeQuickQuiz() {
  document.getElementById('qq-modal-bg').classList.remove('open');
  document.body.style.overflow = '';
  qqState = null;
}

function closeQuickQuizBg(e) {
  if (e.target === document.getElementById('qq-modal-bg')) closeQuickQuiz();
}

function qqRenderQ() {
  const { qs, cur, score } = qqState;
  const total = qs.length;
  document.getElementById('qq-scorelive').textContent = `${score}/${cur}`;
  document.getElementById('qq-pips').innerHTML = qs.map((_, i) => {
    const cls = i < cur ? 'done' : (i === cur ? 'current' : '');
    return `<div class="qq-pip${cls ? ' ' + cls : ''}"></div>`;
  }).join('');

  const q = qs[cur];
  const topicLabel = q._title.replace(/^IT Acronyms:\s*/i, '');
  document.getElementById('qq-text').innerHTML =
    `<span style="font-size:0.7rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:6px">${q._icon} ${topicLabel} · Day ${q._day}</span>` +
    `Q${cur + 1}/${total}: ${q.q}`;

  const letters = ['A','B','C','D'];
  document.getElementById('qq-opts').innerHTML = q.o.map((opt, i) =>
    `<button class="opt" onclick="qqAnswerQ(${i})">
       <span class="oletter">${letters[i]}</span>${opt}
     </button>`
  ).join('');

  document.getElementById('qq-fb').className = 'fbbox';
  document.getElementById('qq-next').className = 'nextbtn';
  document.getElementById('qq-next').textContent = cur + 1 >= total ? 'See Results →' : 'Next →';
  qqState.answered = false;
}

function qqAnswerQ(chosen) {
  if (qqState.answered) return;
  qqState.answered = true;
  const q = qqState.qs[qqState.cur];
  const correct = chosen === q.a;
  if (correct) qqState.score++;
  qqState.results[qqState.cur] = correct;

  document.querySelectorAll('#qq-opts .opt').forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === chosen && !correct) b.classList.add('wrong');
  });

  const fb = document.getElementById('qq-fb');
  fb.textContent = (correct ? '✓ Correct! ' : '✗ Not quite. ') + q.e;
  fb.className = 'fbbox show ' + (correct ? 'correct-fb' : 'wrong-fb');

  document.getElementById('qq-scorelive').textContent = `${qqState.score}/${qqState.cur + 1}`;
  document.getElementById('qq-pips').children[qqState.cur]?.classList.add('done');
  document.getElementById('qq-next').className = 'nextbtn show';
}

function qqNextQ() {
  qqState.cur++;
  if (qqState.cur >= qqState.qs.length) qqShowResult();
  else qqRenderQ();
}

function qqShowResult() {
  const { score, qs } = qqState;
  const max = qs.length;
  const pct = max ? Math.round((score / max) * 100) : 0;
  const tier = pct === 100 ? 100 : pct >= 75 ? 75 : pct >= 50 ? 50 : 0;

  document.getElementById('qq-panel').style.display = 'none';
  const rp = document.getElementById('qq-result-panel');
  rp.style.display = 'block';
  rp.classList.add('show');

  const emojis = { 100: '🏆', 75: '👍', 50: '📚', 0: '💪' };
  const titles = { 100: 'Perfect Score!', 75: 'Well Done!', 50: 'Keep Studying!', 0: 'Keep Going!' };
  const colors = { 100: '#7C3AED', 75: '#58CC02', 50: '#FFC800', 0: '#FF4B4B' };
  const starsFilled = tier === 100 ? 3 : tier >= 75 ? 2 : tier >= 50 ? 1 : 0;

  document.getElementById('qq-re-emoji').textContent = emojis[tier];
  document.getElementById('qq-re-stars').innerHTML = [0, 1, 2].map(i =>
    `<span class="qq-star" style="opacity:${i < starsFilled ? 1 : 0.2}">⭐</span>`
  ).join('');
  document.getElementById('qq-re-title').textContent = titles[tier];
  document.getElementById('qq-re-title').style.color = colors[tier];
  document.getElementById('qq-re-score').innerHTML = `Score: <strong>${score}/${max}</strong>`;
  document.getElementById('qq-re-msg').textContent = 'Quick quiz complete! Open a day to learn more. 🎯';
}

function openSavedModal() {
  renderSavedList();
  document.getElementById('saved-modal-bg').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSavedModal() {
  document.getElementById('saved-modal-bg').classList.remove('open');
  document.body.style.overflow = '';
}
function closeSavedBg(e) {
  if (e.target === document.getElementById('saved-modal-bg')) closeSavedModal();
}
function renderSavedList() {
  const list = bookmarkList();
  document.getElementById('saved-count-sub').textContent = `${list.length} topic${list.length === 1 ? '' : 's'} saved`;
  const el = document.getElementById('saved-list');
  el.innerHTML = list.length
    ? list.map(b => `<div class="saved-row" data-openday="${b.day}" data-openti="${b.ti}">
        <span style="font-size:20px">${b.icon}</span>
        <div class="saved-row-info">
          <div class="saved-row-title">${b.title}</div>
          <div class="saved-row-sub">Day ${b.day}</div>
        </div>
        <button type="button" class="saved-remove-btn" data-unsave="${bookmarkKey(b.day, b.ti)}" title="Remove bookmark">⭐</button>
      </div>`).join('')
    : `<div class="saved-empty">🔖 No saved topics yet.<br>Tap the ☆ on any topic to save it here.</div>`;

  el.querySelectorAll('[data-openday]').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('[data-unsave]')) return;
      const d = parseInt(row.dataset.openday, 10);
      const ti = parseInt(row.dataset.openti, 10);
      closeSavedModal();
      openDay(d);
      switchTab(ti);
    });
  });
  el.querySelectorAll('[data-unsave]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const [d, ti] = btn.dataset.unsave.split('-').map(Number);
      toggleBookmark(d, ti);
      renderSavedList();
    });
  });
}

setInterval(saveState, 60000);
document.getElementById('homeBtnGeneral').addEventListener('click', () => {
  try { window.parent.postMessage('exitGeneral', '*'); } catch (e) {}
});
document.getElementById('openSavedBtn').addEventListener('click', openSavedModal);
updateSavedBtn();

<script type="text/html" id="rubikSrc">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>30-Day CFOP Bootcamp — A Speedcubing Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Dancing+Script:wght@600;700&family=Space+Grotesk:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&family=Poppins:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"><\/script>
<style>
  :root{
    --font-display:'Baloo 2',sans-serif; --font-body:'Nunito','Segoe UI',sans-serif;
    --bg:#F4F0FF;
    --surface:#FFFFFF;
    --surface-2:#F4F0FF;
    --border:#D8CEF0;
    --text:#2D2640;
    --mute:#6B5E8A;
    --red:#FF4B4B;
    --blue:#1CB0F6;
    --yellow:#FFC800;
    --orange:#FF9600;
    --green:#58CC02;
    --violet:#CE82FF;

    /* Structural aliases so the Flag-Atlas-style path/quiz components
       below can be dropped in unchanged — everything here now resolves
       to Flag Atlas's own palette, same as the main app. */
    --ink:var(--text); --ink-soft:var(--mute); --line:var(--border); --card:var(--surface);
    --accent1:#7C3AED; --accent1-dark:#5B21B6;
    --accent2:#EC4899; --accent2-dark:#BE185D;
    --gold:var(--yellow); --gold-dark:#E6AC00; --gold-text:#7A5B00;
    --purple:var(--violet); --purple-dark:#A557E0;
    --orange-dark:#E07F00;
    --green-dark:#46A302; --green-bg:#D7FFB8; --green-text:#3C8403;
    --red-dark:#E62E2E; --red-bg:#FFDFE0; --red-text:#C9302C;
    --blue-dark:#0A91D6; --blue-bg:#DDF4FF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(124,58,237,0.08), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(236,72,153,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px;}
  h1,h2,h3{font-family:var(--font-display); margin:0;}
  .mono{font-family:'JetBrains Mono', monospace;}

  /* header — copies Flag Atlas's own header format: Home button above the title */
  .rc-header-badges{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px}
  .rc-home-btn{
    display:flex;align-items:center;justify-content:center;gap:5px;
    background:var(--accent1);border:2px solid var(--accent1-dark);
    box-shadow:0 3px 0 var(--accent1-dark);border-radius:999px;padding:7px 14px;
    font-family:var(--font-body);font-weight:800;font-size:12px;color:#fff;
    flex-shrink:0;cursor:pointer;transition:transform .1s;min-width:74px;height:34px;
  }
  .rc-home-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent1-dark)}
  .rc-save-btn{background:var(--yellow);border-color:var(--yellow-dk,#C79200);box-shadow:0 3px 0 var(--yellow-dk,#C79200);color:#2D2640}
  .rc-save-btn:active{box-shadow:0 1px 0 var(--yellow-dk,#C79200)}
  .rc-bookmark-btn{position:absolute;top:0;right:0;width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--border,#D9D9D9);box-shadow:0 3px 0 var(--border,#D9D9D9);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
  .rc-bookmark-btn.active{background:#FFF6D8;border-color:#F0B300;box-shadow:0 3px 0 #F0B300}
  .rc-saved-empty{text-align:center;padding:40px 20px;color:var(--muted,#6B5E8A);font-size:13.5px;font-weight:600}
  .rc-saved-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--border,#D9D9D9);border-radius:14px;margin-bottom:10px;cursor:pointer;background:#fff}
  .rc-saved-row-info{flex:1;min-width:0}
  .rc-saved-row-title{font-weight:800;font-size:13.5px}
  .rc-saved-row-sub{font-size:11.5px;color:var(--muted,#6B5E8A);font-weight:600}
  .rc-saved-remove-btn{font-size:18px;background:none;border:none;cursor:pointer;flex-shrink:0;padding:4px;line-height:1}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--red); margin-bottom:10px; font-weight:700;
  }
  .title{font-size:clamp(24px,7vw,32px); line-height:1.1; font-weight:800; letter-spacing:-.01em;}
  .subtitle{color:var(--mute); font-size:15px; margin-top:10px; max-width:52ch; line-height:1.5;}

  /* progress bar */
  .progress-row{
    display:flex; align-items:center; gap:14px; margin-top:22px;
  }
  .progress-track{
    flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden;
    border:1px solid var(--border);
  }
  .progress-fill{
    height:100%; border-radius:99px;
    background:linear-gradient(90deg, var(--red), var(--yellow));
    transition:width 0.4s ease;
  }
  .progress-label{
    font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--mute); white-space:nowrap;
  }

  /* timer widget - signature element */
  .timer-card{
    margin-top:28px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:26px 20px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .timer-card::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(255,75,75,0.06), transparent 40%);
    pointer-events:none;
  }
  .timer-label{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--mute); margin-bottom:6px;
  }
  .timer-display{
    font-family:'JetBrains Mono', monospace;
    font-size:56px; font-weight:700;
    letter-spacing:0.01em;
    transition:color 0.15s ease, transform 0.15s ease;
  }
  .timer-display.idle{color:var(--text);}
  .timer-display.ready{color:var(--green); transform:scale(1.03);}
  .timer-display.running{color:var(--red);}
  .timer-pad{
    margin:18px auto 4px; width:100%; max-width:320px;
    padding:14px 10px; border-radius:12px;
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--mute); font-size:13px; cursor:pointer;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .timer-pad.ready{border-color:var(--green); color:var(--green);}
  .timer-pad.running{border-color:var(--red); color:var(--red);}
  .timer-stats{
    display:flex; justify-content:center; gap:22px; margin-top:16px;
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--mute);
  }
  .timer-stats b{color:var(--text); font-size:13px; display:block; margin-top:2px;}
  .timer-history{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:14px;
  }
  .timer-chip{
    font-family:'JetBrains Mono', monospace; font-size:11px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:6px; padding:3px 7px; color:var(--mute);
  }
  .timer-clear{
    margin-top:14px; background:none; border:none; color:var(--mute);
    font-size:12px; text-decoration:underline; cursor:pointer; font-family:var(--font-body);
  }

  /* quiz */
  .quiz-filters{
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:14px;
  }
  .quiz-filter{
    font-family:'JetBrains Mono', monospace; font-size:11px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--mute);
    border-radius:99px; padding:5px 12px; cursor:pointer;
  }
  .quiz-filter.active{background:var(--blue); border-color:var(--blue); color:#0d1117;}
  .quiz-filter.disabled{opacity:.4; cursor:not-allowed;}
  .quiz-filter:disabled{opacity:.4; cursor:not-allowed;}
  .quiz-mode-toggle{
    display:flex; gap:6px; justify-content:center; margin-top:16px;
  }
  .quiz-mode-btn{
    font-family:var(--font-display); font-weight:700; font-size:12.5px;
    background:var(--surface-2); border:2px solid var(--border); color:var(--mute);
    border-radius:99px; padding:7px 16px; cursor:pointer;
  }
  .quiz-mode-btn.active{background:var(--accent1); border-color:var(--accent1-dark); color:#fff;}
  .quiz-cube-stage{
    perspective:640px; perspective-origin:50% 40%; margin:6px auto 0;
  }
  .quiz-stats{
    display:flex; justify-content:center; gap:22px; margin-top:16px;
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--mute);
  }
  .quiz-stats b{color:var(--text); font-size:13px; display:block; margin-top:2px;}
  .quiz-prompt-label{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--mute); margin-top:20px; text-align:center;
  }
  .quiz-prompt{
    font-size:22px; font-weight:700; margin-top:8px; min-height:30px; text-align:center;
  }
  .quiz-prompt.mono{font-family:'JetBrains Mono', monospace; font-size:18px; color:var(--yellow);}
  .quiz-options{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px;
  }
  .quiz-option{
    background:var(--surface-2); border:2px solid var(--border); color:var(--text);
    border-radius:16px; padding:15px 10px; font-size:14.5px; font-weight:700; cursor:pointer;
    font-family:var(--font-body); transition:all 0.1s ease; box-shadow:0 4px 0 var(--border);
    min-height:54px;
  }
  .quiz-option:not(:disabled):active{transform:translateY(3px); box-shadow:0 1px 0 var(--border);}
  .quiz-option.mono{font-family:'JetBrains Mono', monospace; font-size:12.5px;}
  .quiz-option.correct{background:var(--green-bg) !important; border-color:var(--green) !important; color:var(--green-text) !important; box-shadow:0 4px 0 var(--green-dark) !important;}
  .quiz-option.wrong{background:var(--red-bg) !important; border-color:var(--red) !important; color:var(--red-text) !important; box-shadow:0 4px 0 var(--accent1-dark) !important;}
  .quiz-option-image{
    padding:8px; display:flex; align-items:center; justify-content:center; min-height:104px;
  }
  @media (max-width:480px){
    .quiz-options{grid-template-columns:1fr;}
  }

  /* checkpoint / smart difficulty gate */
  .checkpoint{
    margin-top:22px;
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--yellow);
    border-radius:12px;
    padding:18px 20px;
  }
  .checkpoint.ready{border-left-color:var(--green);}
  .checkpoint-title{font-family:var(--font-display); font-size:17px; font-weight:600;}
  .checkpoint-sub{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--mute); margin-top:10px;
  }
  .checkpoint-list{list-style:none; margin:8px 0 0; padding:0;}
  .checkpoint-list li{
    display:flex; align-items:center; gap:10px; padding:6px 0;
    font-size:14px; color:var(--text);
  }
  .checkpoint-mark{
    width:20px; height:20px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700;
  }
  .checkpoint-list li.ok .checkpoint-mark{background:rgba(88,204,2,0.2); color:var(--green);}
  .checkpoint-list li.no .checkpoint-mark{background:rgba(107,94,138,0.15); color:var(--mute);}
  .checkpoint-list li.ok{color:var(--text);}
  .checkpoint-list li.no{color:var(--mute);}
  .checkpoint-avg{
    margin-left:auto; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--mute);
    white-space:nowrap;
  }
  .checkpoint-message{
    margin-top:14px; font-size:13px; font-weight:600; color:var(--yellow);
  }
  .checkpoint.ready .checkpoint-message{color:var(--green);}

  /* ── chapters (phases), copied from Flag Atlas's path view ── */
  @keyframes pulseGlow{0%,100%{box-shadow:0 4px 0 var(--accent1-dark),0 0 0 0 rgba(124,58,237,0)}50%{box-shadow:0 4px 0 var(--accent1-dark),0 0 0 8px rgba(124,58,237,0.18)}}
  .current-pulse{animation:pulseGlow 2.2s ease-in-out infinite;}
  .continent-list{display:flex; flex-direction:column; gap:30px; margin-top:34px;}
  .chapter-header{display:flex; align-items:center; gap:10px; margin-bottom:6px; background:var(--chap-color,var(--accent1)); border-radius:16px; padding:14px 18px; box-shadow:0 3px 0 rgba(0,0,0,0.3); width:100%; border:none; cursor:pointer;}
  .chapter-dot{width:10px; height:10px; border-radius:50%; display:inline-block; background:#fff; flex-shrink:0;}
  .chapter-title{font-size:17px; font-weight:700; color:#fff; letter-spacing:-.01em; flex:1; text-align:left; font-family:var(--font-display);}
  .chapter-sub{font-size:11.5px; color:rgba(255,255,255,0.85); font-weight:700;}

  .day-path{display:grid; grid-template-columns:repeat(3,1fr); gap:14px 8px; padding:14px 0 4px;}
  .day-node-wrap{display:flex; width:100%; justify-content:center; flex-direction:column; align-items:center;}
  .day-node-outer{position:relative; display:flex;}
  .day-node{display:flex; flex-direction:column; align-items:center; justify-content:center; width:clamp(52px,14vw,68px); height:clamp(52px,14vw,68px); border-radius:50%; border:2.5px solid; transition:transform .12s,box-shadow .12s; flex-shrink:0;}
  .day-node:not(:disabled):active{transform:translateY(3px);}
  .day-num{font-size:clamp(18px,5vw,22px); font-weight:800; font-family:var(--font-display); line-height:1;}
  .day-caption{font-size:10px; color:var(--mute); text-align:center; line-height:1.3; font-weight:700; margin-top:5px; max-width:90px;}
  @media (max-width:480px){
    .day-path{gap:10px 4px;}
    .day-node{width:clamp(46px,12vw,56px); height:clamp(46px,12vw,56px);}
    .chapter-header{padding:10px 12px;}
    .chapter-title{font-size:15px;}
  }

  /* ── day lesson detail (copied from Flag Atlas's lesson view) ── */
  .lesson-wrap{padding:16px 16px 110px; max-width:480px; margin:0 auto; width:100%;}
  .top-bar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;}
  .icon-btn{width:44px; height:44px; border-radius:50%; background:#fff; border:2px solid var(--border); box-shadow:0 3px 0 var(--border); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; color:var(--text); cursor:pointer; transition:transform .1s;}
  .icon-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--border);}
  .lesson-eyebrow{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); margin-bottom:12px; font-weight:800; text-align:center; font-family:'JetBrains Mono', monospace;}
  .stamp-card{background:var(--surface); border:2px solid var(--border); box-shadow:0 4px 0 var(--border); border-radius:24px; padding:26px 22px; text-align:left; border-left:3px solid var(--phase-color, var(--red));}
  .stamp-name{font-size:clamp(20px,6vw,24px); font-weight:800; color:var(--text); margin:0 0 6px;}
  .stamp-fact{font-size:14px; color:var(--mute); line-height:1.6; font-weight:600; margin-bottom:4px;}
  .stamp-divider{width:40px; height:3px; background:var(--border); border-radius:2px; margin:14px 0;}
  .day-section-label{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--mute); margin:14px 0 8px;
  }
  .day-section-label:first-child{margin-top:0;}
  .task-list{margin:0; padding:0; list-style:none;}
  .task-list li{
    font-size:14px; color:var(--text); line-height:1.5; padding-left:16px;
    position:relative; margin-bottom:6px;
  }
  .task-list li::before{
    content:"—"; position:absolute; left:0; color:var(--mute);
  }
  .algs{display:flex; flex-direction:column; gap:6px;}
  .alg-row{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; padding:8px 12px;
  }
  .alg-name{font-size:12px; color:var(--mute); min-width:120px; font-weight:600;}
  .alg-moves{font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--yellow); letter-spacing:0.02em;}

  /* ── embedded algorithm-animation cube widget ── */
  .alg-block{display:flex; flex-direction:column;}
  .alg-toggle-btn{
    font-family:var(--font-display); font-weight:700; font-size:11px; letter-spacing:.02em;
    border-radius:8px; padding:5px 10px; border:1.5px solid var(--accent1-dark);
    background:var(--accent1); color:#fff; cursor:pointer; flex-shrink:0; margin-left:auto;
    transition:transform .08s ease;
  }
  .alg-toggle-btn:active{transform:translateY(1px);}
  .alg-cube-panel{
    background:var(--surface-2); border:1px solid var(--border); border-top:none;
    border-radius:0 0 10px 10px; margin:-2px 0 6px; padding:14px 10px 12px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .cube3d-stage{
    width:176px; height:176px; margin:6px auto 4px; perspective:640px; perspective-origin:50% 40%;
  }
  .cube3d-scene{
    width:100%; height:100%; position:relative; transform-style:preserve-3d;
    transform:rotateX(20deg) rotateY(-35deg);
  }
  .cube3d-layer{ position:absolute; inset:0; transform-style:preserve-3d; }
  .cubie3d{
    position:absolute; top:50%; left:50%; width:26px; height:26px;
    margin:-13px 0 0 -13px; transform-style:preserve-3d;
  }
  .cubie3d-face{
    position:absolute; inset:0; border-radius:3px;
    box-shadow:inset 0 0 0 1.5px #0d0a17, 0 1px 2px rgba(0,0,0,.35);
    backface-visibility:hidden;
  }
  .alg-cube-movetrack{display:flex; flex-wrap:wrap; gap:4px; justify-content:center; max-width:280px;}
  .alg-cube-movetoken{
    font-family:'JetBrains Mono', monospace; font-size:12px; padding:2px 6px; border-radius:5px;
    background:var(--surface); color:var(--mute); border:1px solid var(--border);
  }
  .alg-cube-movetoken.done{color:var(--text); border-color:transparent;}
  .alg-cube-movetoken.active{background:var(--accent1); color:#fff; border-color:var(--accent1-dark); font-weight:700;}
  .alg-cube-counter{font-size:11.5px; color:var(--mute); font-weight:700; text-align:center; min-height:15px;}
  .alg-cube-controls{display:flex; align-items:center; gap:10px;}
  .alg-cube-btn{
    width:36px; height:36px; border-radius:50%; background:var(--surface); border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; color:var(--text);
    box-shadow:0 2px 0 var(--border);
  }
  .alg-cube-btn:active{transform:translateY(2px); box-shadow:none;}
  .alg-cube-btn:disabled{opacity:.35; cursor:default;}
  .alg-cube-btn.primary{background:var(--accent1); color:#fff; border-color:var(--accent1-dark); box-shadow:0 2px 0 var(--accent1-dark);}
  .mistake-card{margin-top:14px; background:rgba(255,75,75,0.08); border:1px solid var(--red); border-radius:12px; padding:12px 14px;}
  .mistake-card b{color:var(--red);}
  .mistake-card .right{color:var(--green); font-weight:600;}

  /* ── shared buttons (copied from Flag Atlas) ── */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:.02em; border-radius:16px; padding:15px 22px; border:2px solid transparent; transition:transform .08s ease,box-shadow .08s ease; min-height:52px; width:100%; cursor:pointer;}
  .btn:active{transform:translateY(3px);}
  .btn-primary{background:var(--accent1); color:#fff; border-color:var(--accent1-dark); box-shadow:0 4px 0 var(--accent1-dark);}
  .btn-primary:active{box-shadow:0 1px 0 var(--accent1-dark);}
  .btn-secondary{background:var(--surface-2); color:var(--text); border-color:var(--border); box-shadow:0 4px 0 var(--border);}
  .btn-secondary:active{box-shadow:0 1px 0 var(--border);}
  .btn-gold{background:var(--gold); color:var(--gold-text); border-color:var(--gold-dark); box-shadow:0 4px 0 var(--gold-dark);}
  .btn-gold:active{box-shadow:0 1px 0 var(--gold-dark);}
  .btn-blue{background:var(--blue); color:#fff; border-color:var(--blue-dark); box-shadow:0 4px 0 var(--blue-dark);}
  .btn-blue:active{box-shadow:0 1px 0 var(--blue-dark);}
