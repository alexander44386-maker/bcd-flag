<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Flag Atlas 🌍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
:root{
  --green:#58CC02; --green-dark:#46A302; --green-bg:#D7FFB8; --green-text:#3C8403;
  --blue:#1CB0F6; --blue-dark:#0A91D6; --blue-bg:#DDF4FF;
  --gold:#FFC800; --gold-dark:#E6AC00; --gold-text:#7A5B00;
  --red:#FF4B4B; --red-dark:#E62E2E; --red-bg:#FFDFE0; --red-text:#C9302C;
  --purple:#CE82FF; --purple-dark:#A557E0;
  --orange:#FF9600; --orange-dark:#E07F00;
  --ink:#2D2640; --ink-soft:#6B5E8A;
  --line:#D8CEF0; --bg:#F4F0FF; --bg-soft:#EDE6FF;
  --card:#FFFFFF;
  --accent1:#7C3AED; --accent1-dark:#5B21B6;
  --accent2:#EC4899; --accent2-dark:#BE185D;
  --night-sky:linear-gradient(160deg,#1a0533 0%,#2d1054 40%,#1a1a4e 100%);
}
body{background:var(--bg-soft);font-family:'Nunito','Segoe UI',sans-serif;color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;
  background-image:radial-gradient(ellipse at 20% 20%,rgba(124,58,237,0.08) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 80%,rgba(236,72,153,0.08) 0%,transparent 60%),
    radial-gradient(ellipse at 50% 50%,rgba(28,176,246,0.05) 0%,transparent 70%);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:default;opacity:0.5}
h1,h2,h3{font-family:'Baloo 2',sans-serif}

/* ── ANIMATIONS ── */
@keyframes pulseGlow{0%,100%{box-shadow:0 4px 0 var(--accent1-dark),0 0 0 0 rgba(124,58,237,0)}50%{box-shadow:0 4px 0 var(--accent1-dark),0 0 0 8px rgba(124,58,237,0.18)}}
@keyframes stampIn{from{opacity:0;transform:scale(0.88) rotate(-2deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes feedbackIn{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes bounceIn{0%{transform:scale(0.4);opacity:0}60%{transform:scale(1.15)}80%{transform:scale(0.95)}100%{transform:scale(1);opacity:1}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(420px) rotate(720deg);opacity:0}}
@keyframes wobble{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}
@keyframes floatStars{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

.stamp-enter{animation:stampIn .35s ease}
.feedback-enter{animation:feedbackIn .28s cubic-bezier(.2,.7,.3,1)}
.bounce-in{animation:bounceIn .5s cubic-bezier(.36,.07,.19,.97)}
.slide-up{animation:slideUp .4s ease}
.pop-in{animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
.current-pulse{animation:pulseGlow 2.2s ease-in-out infinite}

/* ── LAYOUT ── */
#app{width:100%;min-height:100vh;display:flex;flex-direction:column}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:clamp(14px,3.6vw,16px);letter-spacing:.02em;border-radius:16px;padding:15px 22px;border:2px solid transparent;transition:transform .08s ease,box-shadow .08s ease;min-height:52px;width:100%}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn-primary{background:var(--accent1);color:#fff;border-color:var(--accent1-dark);box-shadow:0 4px 0 var(--accent1-dark)}
.btn-primary:active:not(:disabled){box-shadow:0 1px 0 var(--accent1-dark)}
.btn-secondary{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.btn-secondary:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.btn-gold{background:var(--gold);color:var(--gold-text);border-color:var(--gold-dark);box-shadow:0 4px 0 var(--gold-dark)}
.btn-gold:active:not(:disabled){box-shadow:0 1px 0 var(--gold-dark)}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue-dark);box-shadow:0 4px 0 var(--blue-dark)}
.btn-blue:active:not(:disabled){box-shadow:0 1px 0 var(--blue-dark)}
.btn-pink{background:var(--accent2);color:#fff;border-color:var(--accent2-dark);box-shadow:0 4px 0 var(--accent2-dark)}
.btn-pink:active:not(:disabled){box-shadow:0 1px 0 var(--accent2-dark)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red-dark);box-shadow:0 4px 0 var(--red-dark)}
.btn-red:active:not(:disabled){box-shadow:0 1px 0 var(--red-dark)}
.btn-wide{width:auto}

/* ── PATH VIEW ── */
.path-wrap{padding:16px 12px 24px;max-width:680px;margin:0 auto;width:100%}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent1);font-weight:800;margin-bottom:3px}
.signature{font-family:'Dancing Script','Brush Script MT',cursive;font-size:16px;color:var(--ink-soft);letter-spacing:.04em;margin-top:-10px;margin-bottom:14px;opacity:0.85;font-style:italic}
.h1{font-size:clamp(24px,7vw,32px);font-weight:800;color:var(--ink);letter-spacing:-.01em}
.header-badges{display:flex;gap:6px;flex-shrink:0;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.streak-badge{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-size:16px;color:var(--ink);flex-shrink:0}
.save-btn,.reset-btn{display:flex;align-items:center;justify-content:center;gap:5px;background:var(--accent1);border:2px solid var(--accent1-dark);box-shadow:0 3px 0 var(--accent1-dark);border-radius:999px;padding:7px 14px;font-weight:800;font-size:12px;color:#fff;flex-shrink:0;cursor:pointer;transition:transform .1s;min-width:74px;height:34px}
.save-btn:active,.reset-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent1-dark)}
.progress-track{position:relative;height:14px;background:var(--line);border-radius:999px;margin-bottom:8px;overflow:hidden}
.progress-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,var(--accent1),var(--accent2));border-radius:999px;transition:width .6s ease}
.progress-label{font-size:12.5px;color:var(--ink-soft);font-weight:700;display:block;margin-bottom:18px}
.continent-list{display:flex;flex-direction:column;gap:30px}
.chapter-header{display:flex;align-items:center;gap:10px;margin-bottom:6px;background:var(--chap-color,var(--accent1));border-radius:16px;padding:14px 18px;box-shadow:0 3px 0 rgba(0,0,0,0.15)}
.chapter-dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#fff;flex-shrink:0}
.chapter-title{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.01em;flex:1}
.chapter-sub{font-size:11.5px;color:rgba(255,255,255,0.85);font-weight:700}

.day-path{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;padding:14px 0 4px}
.day-node-wrap{display:flex;width:100%;justify-content:center;flex-direction:column;align-items:center}
.day-node{display:flex;flex-direction:column;align-items:center;justify-content:center;width:clamp(52px,14vw,68px);height:clamp(52px,14vw,68px);border-radius:50%;border:2.5px solid;transition:transform .12s,box-shadow .12s;flex-shrink:0}
.day-node:not(:disabled):active{transform:translateY(3px)}
.day-num{font-size:clamp(18px,5vw,22px);font-weight:800;font-family:'Baloo 2',sans-serif;line-height:1}
.day-caption{font-size:10px;color:var(--ink-soft);text-align:center;line-height:1.3;font-weight:700;margin-top:5px;max-width:90px}
.day-caption .flags{font-size:13px;letter-spacing:1px;display:block;margin-bottom:1px}

/* ── LESSON VIEW ── */
.lesson-wrap{padding:16px 16px 110px;max-width:480px;margin:0 auto;width:100%;display:flex;flex-direction:column;flex:1}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;transition:transform .1s}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.dots-row{display:flex;gap:6px;flex:1;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;transition:background .3s}
.lesson-eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px;font-weight:800;text-align:center}
.stamp-card{background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line),0 0 30px rgba(124,58,237,0.06);border-radius:24px;padding:30px 22px;display:flex;flex-direction:column;align-items:center;text-align:center}
.stamp-flag{font-size:clamp(72px,22vw,96px);line-height:1;display:block;margin-bottom:6px;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.15))}
.stamp-name{font-size:clamp(22px,6vw,28px);font-weight:800;color:var(--ink);margin:6px 0 6px}
.stamp-capital{font-size:13px;font-weight:700;color:var(--blue-dark);background:var(--blue-bg);border-radius:999px;padding:5px 14px;margin-bottom:8px;display:inline-flex;align-items:center;gap:5px}
.stamp-attraction{font-size:13px;font-weight:700;color:var(--accent1);background:rgba(124,58,237,0.08);border-radius:999px;padding:5px 14px;margin-bottom:12px;display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(124,58,237,0.2)}
.stamp-divider{width:40px;height:3px;background:var(--line);border-radius:2px;margin:8px auto 14px}
.stamp-fact{font-size:14.5px;color:var(--ink-soft);line-height:1.6;font-weight:600}
.lesson-footer{display:flex;gap:10px;margin-top:18px}

/* ── DOCK ── */
.dock-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:50;max-width:480px;margin:0 auto;display:flex;gap:10px;box-shadow:0 -4px 20px rgba(124,58,237,0.07)}
.dock-bar.path-dock{max-width:680px}

/* ── QUIZ VIEW ── */
.quiz-wrap{padding:16px 16px 28px;max-width:480px;margin:0 auto;width:100%;display:flex;flex-direction:column;flex:1}
.quiz-progress-track{flex:1;height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent1),var(--accent2));border-radius:999px;transition:width .4s ease}
.hearts-row{display:flex;gap:3px;font-size:19px;flex-shrink:0}
.quiz-question-label{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:16px 0 10px;text-align:center}
.quiz-flag-wrap{display:flex;justify-content:center;margin-bottom:18px}
.quiz-flag{font-size:clamp(76px,24vw,100px);line-height:1;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,0.15));animation:bounceIn .5s ease}
.choices-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:130px}
@media(max-width:340px){.choices-grid{grid-template-columns:1fr}}
.choice-btn{padding:15px 10px;border-radius:16px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:14.5px;font-weight:700;color:var(--ink);text-align:center;transition:all .1s;cursor:pointer;line-height:1.3;min-height:54px}
.choice-btn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.choice-btn:not(:disabled):hover{border-color:var(--accent1)}
.choice-correct{background:var(--green-bg) !important;border-color:var(--green) !important;color:var(--green-text) !important;box-shadow:0 4px 0 var(--green-dark) !important}
.choice-wrong{background:var(--red-bg) !important;border-color:var(--red) !important;color:var(--red-text) !important;box-shadow:0 4px 0 var(--red-dark) !important}
.feedback-bar{position:fixed;left:0;right:0;bottom:0;border-top:3px solid;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;z-index:60;box-shadow:0 -6px 24px rgba(0,0,0,0.1)}
.feedback-heading{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.feedback-fact{font-size:13.5px;line-height:1.5;color:var(--ink-soft);margin-bottom:14px;font-weight:600}
.feedback-attraction{font-size:12.5px;font-weight:700;color:var(--accent1);background:rgba(124,58,237,0.08);border-radius:10px;padding:6px 10px;margin-bottom:8px;display:flex;align-items:center;gap:5px}

/* ── RESULT VIEW ── */
.result-wrap{padding:40px 22px 48px;max-width:480px;margin:0 auto;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;justify-content:center}
.result-title{font-size:clamp(22px,6.5vw,28px);font-weight:800;color:var(--ink);margin-bottom:4px}
.result-subtitle{font-size:13px;color:var(--ink-soft);margin-bottom:24px;text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.result-stats-row{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;justify-content:center}
.result-stat{display:flex;flex-direction:column;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 18px;min-width:84px}
.result-stat-num{font-size:22px;font-weight:800;color:var(--ink);font-family:'Baloo 2',sans-serif}
.result-stat-label{font-size:11px;color:var(--ink-soft);margin-top:2px;font-weight:700}
.result-message{font-size:14.5px;line-height:1.6;color:var(--ink-soft);margin-bottom:26px;max-width:360px;font-weight:600}
.result-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}

/* ── QUICK 5 BANNER ── */
.quick5-banner{background:linear-gradient(135deg,var(--accent1),var(--accent2));border-radius:20px;padding:22px;margin-top:14px;text-align:center;color:#fff;position:relative;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,0.15)}
.quick5-banner::before{content:'⚡';position:absolute;top:10px;right:16px;font-size:46px;opacity:.18;line-height:1}
.quick5-title{font-size:21px;font-weight:800;margin-bottom:4px;font-family:'Baloo 2',sans-serif}
.quick5-subtitle{font-size:12.5px;opacity:.9;margin-bottom:16px;font-weight:700}
.quick5-pips{display:flex;justify-content:center;gap:5px;margin-bottom:18px;flex-wrap:wrap}
.quick5-pip{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.18);border:2px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}

/* ── CONFETTI ── */
.confetti-piece{position:fixed;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:9999;animation:confettiFall linear forwards}

/* ── XP BAR ── */
.xp-row{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.xp-track{flex:1;height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:999px;transition:width .8s ease}
.xp-label{font-size:11.5px;color:var(--ink-soft);font-weight:800;white-space:nowrap}

/* ── LEADERBOARD CARD ── */
.leaderboard-card{width:100%;max-width:360px;background:#fff;border-radius:18px;border:2px solid var(--line);padding:18px;margin:14px 0}
.leaderboard-bar{height:14px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0}
.leaderboard-fill{height:100%;border-radius:999px;transition:width 1s ease .3s}

/* ── SAVE TOAST ── */
.save-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--accent1);color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:12px 22px;z-index:9999;box-shadow:0 4px 20px rgba(124,58,237,0.4);animation:popIn .3s ease;white-space:nowrap}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(29,18,52,0.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:24px;padding:28px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.18);animation:bounceIn .4s ease}
.modal-title{font-size:22px;font-weight:800;color:var(--ink);margin-bottom:8px;font-family:'Baloo 2',sans-serif}
.modal-body{font-size:14.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:22px;font-weight:600}
.modal-actions{display:flex;flex-direction:column;gap:10px}

@media(max-width:400px){
  .path-wrap{padding:12px 8px 20px}
  .day-path{gap:10px 4px}
  .day-node{width:clamp(46px,12vw,56px);height:clamp(46px,12vw,56px)}
  .day-num{font-size:clamp(15px,4vw,18px)}
  .day-caption{font-size:9px;max-width:72px}
  .chapter-header{padding:10px 12px}
  .chapter-title{font-size:15px}
  .h1{font-size:22px}
  .save-btn,.reset-btn{padding:6px 10px;font-size:11px}
  .quick5-banner{padding:16px 14px}
  .quick5-title{font-size:17px}
  .stamp-card{padding:20px 14px}
  .choices-grid{gap:8px;margin-bottom:140px}
  .choice-btn{font-size:13px;padding:12px 8px;min-height:50px}
  .feedback-bar{padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
  .feedback-heading{font-size:16px}
  .feedback-fact{font-size:12.5px}
  .result-wrap{padding:24px 16px 36px}
  .result-title{font-size:20px}
  .result-stat{padding:8px 12px;min-width:70px}
  .result-stat-num{font-size:18px}
  .quiz-wrap{padding:12px 12px 24px}
  .quiz-question-label{font-size:13px;margin:12px 0 8px}
  .dock-bar{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
}

@media(max-width:360px){
  .header{gap:6px}
  .header-badges{gap:4px}
  .save-btn,.reset-btn{padding:5px 9px;font-size:10.5px}
  .h1{font-size:20px}
  .eyebrow{font-size:10px}
  .choices-grid{grid-template-columns:1fr 1fr;gap:7px}
  .choice-btn{font-size:12.5px;padding:11px 6px}
  .day-path{grid-template-columns:repeat(3,1fr);gap:8px 4px}
}

@media(min-width:481px){
  .lesson-wrap,.quiz-wrap,.result-wrap{max-width:520px}
  .dock-bar:not(.path-dock){max-width:520px}
  .feedback-bar{max-width:520px}
}

/* Ensure tap targets are always accessible */
@media(hover:none){
  .choice-btn{min-height:56px}
  .btn{min-height:54px}
  .icon-btn{width:48px;height:48px}
}
</style>
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Baloo 2',sans-serif;font-size:18px;color:#6B5E8A">Loading your progress… 🌍</div></div>

<script>
/* ================================================================
   DATA — all countries with flag, fact, capital & top attraction
================================================================ */
const CONTINENTS = [
  {id:"europe",name:"Europe",color:"#7C3AED",colorDark:"#5B21B6",days:[1,2,3,4,5,6,7,8]},
  {id:"asia",name:"Asia",color:"#FF9600",colorDark:"#E07F00",days:[9,10,11,12,13,14,15,16]},
  {id:"africa",name:"Africa",color:"#FFC800",colorDark:"#E6AC00",days:[17,18,19,20,21,22,23]},
  {id:"americas",name:"Americas",color:"#1CB0F6",colorDark:"#0A91D6",days:[24,25,26,27,28,29]},
  {id:"oceania",name:"Oceania & Pacific",color:"#CE82FF",colorDark:"#A557E0",days:[30,31,32,33]},
  {id:"micro",name:"Micronations & More",color:"#EC4899",colorDark:"#BE185D",days:[34,35,36]},
];

const DAYS = [
  // ── EUROPE ──
  {day:1,continent:"europe",title:"Western Europe I",countries:[
    {name:"France",flag:"🇫🇷",capital:"Paris",fact:"The tricolor's blue and red are Paris's colors; white was added for the king during the Revolution.",attraction:"🗼 Eiffel Tower"},

/* ================================================================
   SAVE / LOAD
   Progress is stored in Firebase Realtime Database so it's shared
   across every device that opens this site (no accounts — one
   global save). localStorage is kept as an offline fallback only.
================================================================ */
const SAVE_KEY = "flagatlas_save_v1";

/* ⚠️ REPLACE this with YOUR Firebase Realtime Database URL.
   It looks like: https://your-project-id-default-rtdb.firebaseio.com
   See the README for the 5-minute setup steps. */
const FIREBASE_DB_URL = "https://flag-atlas-6e9b2-default-rtdb.firebaseio.com/";

const CLOUD_SAVE_URL = `${FIREBASE_DB_URL}/save.json`;

async function saveState(){
  const toSave={
    unlockedDay: STATE.unlockedDay,
    completedDays: STATE.completedDays,
    streak: STATE.streak,
  };
  // Always keep a local copy so the game still works offline.
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(toSave)); }catch(e){}

  try{
    const res = await fetch(CLOUD_SAVE_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(toSave),
    });
    if(!res.ok) throw new Error("bad response");
    showToast("✅ Progress saved to the cloud!");
  } catch(e){
    showToast("⚠️ Saved on this device only (offline)");
  }
}

async function loadState(){
  // Try the cloud save first so progress shows up on any device.
  try{
    const res = await fetch(CLOUD_SAVE_URL);
    if(!res.ok) throw new Error("bad response");
    const saved = await res.json();
    if(saved){
      STATE.unlockedDay = saved.unlockedDay ?? 1;
      STATE.completedDays = saved.completedDays ?? [];
      STATE.streak = saved.streak ?? 0;
      try{ localStorage.setItem(SAVE_KEY, JSON.stringify(saved)); }catch(e){}
      return;
    }
  } catch(e){
    // Cloud unreachable (offline, or FIREBASE_DB_URL not set yet) — fall back to local copy.
  }
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const saved=JSON.parse(raw);
    STATE.unlockedDay = saved.unlockedDay ?? 1;
    STATE.completedDays = saved.completedDays ?? [];
    STATE.streak = saved.streak ?? 0;
  } catch(e){}
}

function showToast(msg){
  const existing=document.querySelector(".save-toast");
  if(existing) existing.remove();
  const el=document.createElement("div");
  el.className="save-toast";
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2500);
}

function showResetModal(){
  const overlay=document.createElement("div");
  overlay.className="modal-overlay";
  overlay.innerHTML=`<div class="modal-box">
    <div class="modal-title">🔄 Reset Progress?</div>
    <div class="modal-body">This will erase all your progress, stamps, streak, and saved data. This cannot be undone!</div>
    <div class="modal-actions">
      <button class="btn btn-red" id="confirmReset">🗑️ Yes, Reset Everything</button>
      <button class="btn btn-secondary" id="cancelReset">↩ Keep My Progress</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById("confirmReset").onclick=async()=>{
    localStorage.removeItem(SAVE_KEY);
    try{
      await fetch(CLOUD_SAVE_URL, { method:"DELETE" });
    } catch(e){ /* offline — local reset still applies */ }
    STATE.unlockedDay=1;
    STATE.completedDays=[];
    STATE.streak=0;
    STATE.view="path";
    overlay.remove();
    showToast("🔄 Progress reset!");
    render();
  };
  document.getElementById("cancelReset").onclick=()=>overlay.remove();
}

/* ================================================================
   HELPERS
================================================================ */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function dayLookup(n){return DAYS.find(d=>d.day===n);}

function buildDayQuiz(dayData){
  return shuffle(dayData.countries.map(c=>{
    const wrong=shuffle(ALL_COUNTRIES.filter(x=>x.name!==c.name)).slice(0,3);
    const choices=shuffle([c,...wrong]);
    return {type:"flag",flag:c.flag,answer:c.name,fact:c.fact,capital:c.capital,attraction:c.attraction,choices:choices.map(x=>x.name)};
  }));
}

function getCollectedCountries(){
  return Array.from(
    new Map(
      DAYS.filter(d=>STATE.completedDays.includes(d.day))
          .flatMap(d=>d.countries)
          .map(c=>[c.name,c])
    ).values()
  );
}

function buildQuick5Quiz(){
  const collected=getCollectedCountries();
  if(collected.length<4) return [];
  const pool=shuffle([...collected]).slice(0,8);
  return pool.map(c=>{
    let wrong=shuffle(collected.filter(x=>x.name!==c.name)).slice(0,3);
    if(wrong.length<3){
      const extras=shuffle(ALL_COUNTRIES.filter(x=>x.name!==c.name&&!wrong.find(w=>w.name===x.name)));
      wrong=[...wrong,...extras.slice(0,3-wrong.length)];
    }
    return {type:"flag",flag:c.flag,question:"Which country does this flag belong to?",answer:c.name,choices:shuffle([c,...wrong]).map(x=>x.name),fact:c.fact,capital:c.capital,attraction:c.attraction,badge:"flag"};
  });
}

function launchConfetti(count=40){
  const colors=["#7C3AED","#EC4899","#1CB0F6","#FFC800","#FF9600","#58CC02"];
  for(let i=0;i<count;i++){
    const el=document.createElement("div");
    el.className="confetti-piece";
    el.style.left=Math.random()*100+"vw";
    el.style.top="-20px";
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.width=(6+Math.random()*10)+"px";
    el.style.height=(6+Math.random()*10)+"px";
    el.style.borderRadius=Math.random()>0.5?"50%":"2px";
    el.style.animationDuration=(1.2+Math.random()*1.5)+"s";
    el.style.animationDelay=(Math.random()*0.6)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3000);
  }
}

function render(){
  const app=document.getElementById("app");
  switch(STATE.view){
    case "path":         app.innerHTML=renderPath(); break;
    case "lesson":       app.innerHTML=renderLesson(); break;
    case "quiz":         app.innerHTML=renderQuiz(); break;
    case "result":       app.innerHTML=renderResult(); break;
    case "quick5":       app.innerHTML=renderQuick5Quiz(); break;
    case "quick5result": app.innerHTML=renderQuick5Result(); break;
  }
  window.scrollTo(0,0);
  bindEvents();
}

function renderPath(){
  const pct=Math.min(100,((STATE.unlockedDay-1)/TOTAL_DAYS)*100);
  const xpPct=((STATE.completedDays.length)/TOTAL_DAYS)*100;

  const continentSections=CONTINENTS.map(cont=>{
    const days=cont.days.map(n=>dayLookup(n)).filter(Boolean);
    const nodes=days.map((d,i)=>{
      const locked=d.day>STATE.unlockedDay;
      const done=STATE.completedDays.includes(d.day);
      const current=d.day===STATE.unlockedDay&&!done;
      const bg=done?cont.color:current?"#fff":locked?"#EEEEEE":"#fff";
      const border=done?cont.colorDark:current?cont.color:"#D9D9D9";
      const shadow=done?cont.colorDark:current?cont.colorDark:"#D9D9D9";
      const icon=done?"✓":locked?"🔒":d.day;
      const numColor=done?"#fff":locked?"#B0B0B0":cont.colorDark;
      const preview=d.countries.map(c=>c.flag).join(" ");

      return `<div class="day-node-wrap">
        <button class="day-node${current?" current-pulse":""}"
          style="border-color:${border};background:${bg};box-shadow:0 4px 0 ${shadow};cursor:${locked?"default":"pointer"};opacity:${locked?0.6:1}"
          ${locked?"disabled":""} data-day="${d.day}">
          <span class="day-num" style="color:${numColor}">${icon}</span>
        </button>
        <span class="day-caption">${!locked?`<span class="flags">${preview}</span>`:""}${d.title.split(" ").slice(0,2).join(" ")}</span>
      </div>`;
    }).join("");
    return `<section>
      <div class="chapter-header" style="--chap-color:${cont.color}">
        <span class="chapter-dot"></span>
        <h2 class="chapter-title">${cont.name}</h2>
        <span class="chapter-sub">${cont.days.filter(n=>STATE.completedDays.includes(n)).length}/${cont.days.length}</span>
      </div>
      <div class="day-path">${nodes}</div>
    </section>`;
  }).join("");

  return `<div class="path-wrap">
    <header class="header">
      <div>
        <h1 class="h1">🌍 Flag Atlas</h1>
      </div>
      <div class="header-badges">
        <button class="save-btn" id="saveBtn">💾 Save</button>
        <button class="reset-btn" id="resetBtn">🔄 Reset</button>
      </div>
    </header>
    <p class="signature">by <span style="color:var(--blue)">BCD</span></p>

    <div class="progress-track">
      <div class="progress-fill" style="width:${pct}%"></div>
    </div>
    <span class="progress-label">Day ${Math.min(STATE.unlockedDay,TOTAL_DAYS)} of ${TOTAL_DAYS} · ${STATE.completedDays.length} stamps collected</span>

    <div class="xp-row">
      <span class="xp-label">⭐ XP</span>
      <div class="xp-track"><div class="xp-fill" style="width:${xpPct}%"></div></div>
      <span class="xp-label">${STATE.completedDays.length*100}/${TOTAL_DAYS*100}</span>
    </div>

    <div class="continent-list">${continentSections}</div>

    <div class="quick5-banner slide-up" style="margin-top:36px">
      <div class="quick5-title">⚡ Quick 8 Flag Quiz</div>
      ${(()=>{
        const collected=getCollectedCountries();
        const count=collected.length;
        if(count<4) return `
          <div class="quick5-subtitle">Collect at least 4 stamps to unlock · you have ${count} so far</div>
          <div class="quick5-pips">
            ${[1,2,3,4,5,6,7,8].map(n=>`<div class="quick5-pip" style="opacity:${n<=count?1:0.35}">${n<=count?"✓":n}</div>`).join("")}
          </div>
          <button class="btn btn-gold" disabled style="opacity:0.45">🔒 Collect More Stamps</button>`;
        return `
          <div class="quick5-subtitle">8 flags from your ${count} collected stamp${count===1?"":"s"} · test your memory!</div>
          <div class="quick5-pips">
            <div class="quick5-pip">1</div><div class="quick5-pip">2</div><div class="quick5-pip">3</div><div class="quick5-pip">4</div><div class="quick5-pip">5</div><div class="quick5-pip">6</div><div class="quick5-pip">7</div><div class="quick5-pip">8</div>
          </div>
          <button class="btn btn-gold" id="startQuick5">⚡ Start Quick Quiz</button>`;
      })()}
    </div>
  </div>`;
}

      }
    </div>
  </div>`;
}

/* ================================================================
   QUIZ VIEW
================================================================ */
function renderQuiz(){
  const q=STATE.quiz[STATE.qIndex];
  const sel=STATE.selected;
  const pct=(STATE.qIndex/STATE.quiz.length)*100;
  const hearts=[0,1,2].map(i=>`<span style="opacity:${i<STATE.hearts?1:0.22}">❤️</span>`).join("");

  const choiceBtns=q.choices.map(ch=>{
    return `<button class="choice-btn${sel?(ch===q.answer?" choice-correct":ch===sel?" choice-wrong":""):""}"
      ${sel?"disabled":""} data-choice="${ch}">${ch}</button>`;
  }).join("");

  const feedback=sel?`<div class="feedback-bar feedback-enter" style="background:${sel===q.answer?"var(--green-bg)":"var(--red-bg)"};border-color:${sel===q.answer?"var(--green)":"var(--red)"}">
    <p class="feedback-heading" style="color:${sel===q.answer?"var(--green-text)":"var(--red-text)"}">${sel===q.answer?"🎉 Correct!":"❌ It's "+q.answer}</p>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:700">📍 Capital: <strong>${q.capital}</strong></p>
    ${q.attraction?`<div class="feedback-attraction">🌟 Must-see: <strong>${q.attraction}</strong></div>`:""}
    <p class="feedback-fact">${q.fact}</p>
    <button class="btn ${sel===q.answer?"btn-primary":"btn-secondary"}" id="nextQ">${STATE.qIndex+1>=STATE.quiz.length?"See results 🏆":"Continue →"}</button>
  </div>`:"";

  return `<div class="quiz-wrap">
    <div class="top-bar">
      <button class="icon-btn" id="quitQuiz">✕</button>
      <div class="quiz-progress-track"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
      <div class="hearts-row">${hearts}</div>
    </div>

    <p class="quiz-question-label">Which country is this? 🤔</p>
    <div class="quiz-flag-wrap"><span class="quiz-flag">${q.flag}</span></div>
    <div class="choices-grid">${choiceBtns}</div>
    ${feedback}
  </div>`;
}

/* ================================================================
   RESULT VIEW
================================================================ */
function renderResult(){
  const d=STATE.activeDay;
  const passed=STATE.score>=Math.ceil(STATE.quiz.length*0.6);
  const pct=Math.round((STATE.score/STATE.quiz.length)*100);
  const msgs={
    100:["🏅 PERFECT SCORE! Geography wizard!","You crushed it! Not a single flag stumped you."],
    80:["🌟 Excellent! You really know your flags!","Almost flawless — you're a flag fanatic!"],
    60:["✅ Stamp earned! Solid performance!","You passed! Keep studying to master these flags."],
    0:["😅 So close — you've almost got it!","Don't give up! These flags are tricky."],
  };
  const tier=pct===100?100:pct>=80?80:pct>=60?60:0;
  const [title,msg]=msgs[tier];
  const unlockedNext=d.day===STATE.unlockedDay-1||STATE.completedDays.includes(d.day);

  const starsFilled=pct===100?3:pct>=60?2:1;
  const stars=["⭐","⭐","⭐"].map((s,i)=>`<span style="opacity:${i<starsFilled?1:0.25};font-size:36px">${s}</span>`).join("");

  return `<div class="result-wrap">
    <div style="font-size:64px;margin-bottom:8px;animation:bounceIn .6s ease">${passed?"🏆":"🔄"}</div>
    <div style="display:flex;gap:4px;margin-bottom:12px">${stars}</div>
    <h2 class="result-title">${title}</h2>
    <p class="result-subtitle">Day ${d.day} · ${d.title}</p>

    <div class="result-stats-row">
      <div class="result-stat"><span class="result-stat-num">${STATE.score}/${STATE.quiz.length}</span><span class="result-stat-label">Correct</span></div>
      <div class="result-stat"><span class="result-stat-num">${pct}%</span><span class="result-stat-label">Score</span></div>
      <div class="result-stat"><span class="result-stat-num">${STATE.hearts}❤️</span><span class="result-stat-label">Hearts left</span></div>
    </div>

    <p class="result-message">${msg}${passed&&unlockedNext?" Tomorrow's stamp is now unlocked!":""}</p>

    <div class="result-actions">
      ${!passed?`<button class="btn btn-primary" id="retryQuiz">🔄 Retry Quiz</button>`:""}
      <button class="btn ${passed?"btn-primary":"btn-secondary"}" id="backToPath">🗺️ Back to Map</button>
    </div>
  </div>`;
}

/* ================================================================
   QUICK 5 QUIZ VIEW
================================================================ */
function renderQuick5Quiz(){
  const q=STATE.quick5Quiz[STATE.quick5QIndex];
  const sel=STATE.quick5Selected;

  const pips=[0,1,2,3,4,5,6,7].map(i=>{
    const done=i<STATE.quick5QIndex;
    const cur=i===STATE.quick5QIndex;
    return `<div style="width:18px;height:10px;border-radius:999px;background:${done?"var(--gold)":cur?"rgba(230,172,0,0.45)":"var(--line)"};transition:background .3s"></div>`;
  }).join("");

  const choiceBtns=q.choices.map(ch=>{
    const cls=sel?(ch===q.answer?" choice-correct":ch===sel?" choice-wrong":""):"";
    return `<button class="choice-btn${cls}" ${sel?"disabled":""} data-q5choice="${ch}">${ch}</button>`;
  }).join("");

  const feedback=sel?`<div class="feedback-bar feedback-enter" style="background:${sel===q.answer?"var(--green-bg)":"var(--red-bg)"};border-color:${sel===q.answer?"var(--green)":"var(--red)"}">
    <p class="feedback-heading" style="color:${sel===q.answer?"var(--green-text)":"var(--red-text)"}">${sel===q.answer?"🎉 Correct!":"❌ "+q.answer}</p>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:700">📍 Capital: <strong>${q.capital}</strong></p>
    ${q.attraction?`<div class="feedback-attraction">🌟 Must-see: <strong>${q.attraction}</strong></div>`:""}
    <p class="feedback-fact">${q.fact}</p>
    <button class="btn ${sel===q.answer?"btn-primary":"btn-secondary"}" id="nextQ5">${STATE.quick5QIndex+1>=8?"⚡ See Results":"Next →"}</button>
  </div>`:"";

  return `<div class="quiz-wrap">
    <div class="top-bar">
      <button class="icon-btn" id="quitQ5">✕</button>
      <div style="display:flex;gap:6px;flex:1;justify-content:center">${pips}</div>
      <span style="font-size:13px;font-weight:800;color:var(--ink-soft)">${STATE.quick5QIndex+1}/8</span>
    </div>

    <p class="quiz-question-label">Which stamp is this flag? 🎟️</p>
    <div class="quiz-flag-wrap"><span class="quiz-flag">${q.flag}</span></div>
    <div class="choices-grid">${choiceBtns}</div>
    ${feedback}
  </div>`;
}

/* ================================================================
   QUICK 5 RESULT VIEW
================================================================ */
function renderQuick5Result(){
  const score=STATE.quick5Score;
  const msgs=["📚 Better luck next time!","📚 Better luck next time!","✅ Getting there!","✅ Good effort!","⭐ Nice work!","🌟 Great job!","🌟 Amazing!","🏆 Excellent!","🏆 Perfect score!"];
  const colors=["#FF4B4B","#FF4B4B","#1CB0F6","#1CB0F6","#FFC800","#58CC02","#58CC02","#7C3AED","#7C3AED"];
  const emojis=["😅","😅","😊","😊","😎","🌍","🌍","🎉","🎉"];
  const starsFilled=[0,0,1,1,2,2,3,3,3][score];
  const stars=["⭐","⭐","⭐"].map((s,i)=>`<span style="opacity:${i<starsFilled?1:0.2};font-size:36px">${s}</span>`).join("");

  return `<div class="result-wrap">
    <div style="font-size:72px;margin-bottom:6px;animation:bounceIn .7s ease">${emojis[score]}</div>
    <div style="display:flex;gap:4px;margin-bottom:12px">${stars}</div>
    <h2 class="result-title" style="color:${colors[score]}">${msgs[score]}</h2>
    <p class="result-subtitle">Stamp Quiz Complete! · ${getCollectedCountries().length} stamps collected</p>

    <div class="leaderboard-card">
      <div style="font-size:13px;color:var(--ink-soft);font-weight:800;margin-bottom:8px">Your Score</div>
      <div style="font-size:42px;font-weight:800;color:var(--ink);margin-bottom:6px;font-family:'Baloo 2',sans-serif">${score} / 8</div>
      <div class="leaderboard-bar"><div class="leaderboard-fill" style="width:${(score/8)*100}%;background:var(--gold)"></div></div>
    </div>

    <div class="result-actions">
      <button class="btn btn-gold" id="retryQ5">⚡ Play Again</button>
      <button class="btn btn-secondary" id="backToPath">🗺️ Back to Atlas</button>
    </div>
  </div>`;
}

/* ================================================================
   EVENT BINDING
================================================================ */
function bindEvents(){
  const $ = id=>document.getElementById(id);
  const on = (id,ev,fn)=>{const el=$(id);if(el)el.addEventListener(ev,fn);};

  /* PATH */
  document.querySelectorAll("[data-day]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const day=parseInt(btn.dataset.day);
      if(day>STATE.unlockedDay)return;
      STATE.activeDay=dayLookup(day);
      STATE.cardIndex=0;
      STATE.view="lesson";
      render();
    });
  });
  on("startQuick5","click",()=>{
    STATE.quick5Quiz=buildQuick5Quiz();
    STATE.quick5QIndex=0;
    STATE.quick5Selected=null;
    STATE.quick5Score=0;
    STATE.view="quick5";
    render();
  });
  on("saveBtn","click",()=>saveState());
  on("resetBtn","click",()=>showResetModal());

  /* LESSON */
  on("lessonBack","click",()=>{STATE.view="path";render();});
  on("prevCard","click",()=>{STATE.cardIndex--;render();});
  on("nextCard","click",()=>{STATE.cardIndex++;render();});
  on("startQuiz","click",()=>{
    STATE.quiz=buildDayQuiz(STATE.activeDay);
    STATE.qIndex=0;STATE.selected=null;STATE.score=0;STATE.hearts=3;
    STATE.view="quiz";render();
  });

  /* QUIZ */
  on("quitQuiz","click",()=>{STATE.view="path";render();});
  document.querySelectorAll("[data-choice]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(STATE.selected)return;
      const ch=btn.dataset.choice;
      STATE.selected=ch;
      const correct=ch===STATE.quiz[STATE.qIndex].answer;
      if(correct){STATE.score++;launchConfetti(20);}
      else{STATE.hearts=Math.max(0,STATE.hearts-1);}
      render();
    });
  });
  on("nextQ","click",()=>{
    if(STATE.qIndex+1>=STATE.quiz.length){
      const passed=STATE.score>=Math.ceil(STATE.quiz.length*0.6);
      if(passed&&STATE.activeDay.day===STATE.unlockedDay){
        STATE.unlockedDay=Math.min(TOTAL_DAYS+1,STATE.unlockedDay+1);
        STATE.completedDays=[...new Set([...STATE.completedDays,STATE.activeDay.day])];
        STATE.streak++;
        launchConfetti(60);
      } else if(passed){
        STATE.completedDays=[...new Set([...STATE.completedDays,STATE.activeDay.day])];
      }
      STATE.view="result";render();
    } else {
      STATE.qIndex++;STATE.selected=null;render();
    }
  });

  /* RESULT */
  on("retryQuiz","click",()=>{
    STATE.quiz=buildDayQuiz(STATE.activeDay);
    STATE.qIndex=0;STATE.selected=null;STATE.score=0;STATE.hearts=3;
    STATE.view="quiz";render();
  });
  on("backToPath","click",()=>{STATE.view="path";STATE.activeDay=null;render();});

  /* QUICK 5 */
  on("quitQ5","click",()=>{STATE.view="path";render();});
  document.querySelectorAll("[data-q5choice]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(STATE.quick5Selected)return;
      const ch=btn.dataset.q5choice;
      STATE.quick5Selected=ch;
      const correct=ch===STATE.quick5Quiz[STATE.quick5QIndex].answer;
      if(correct){STATE.quick5Score++;launchConfetti(15);}
      render();
    });
  });
  on("nextQ5","click",()=>{
    if(STATE.quick5QIndex+1>=STATE.quick5Quiz.length){
      if(STATE.quick5Score>=6)launchConfetti(80);
      STATE.view="quick5result";render();
    } else {
      STATE.quick5QIndex++;STATE.quick5Selected=null;render();
    }
  });
  on("retryQ5","click",()=>{
    STATE.quick5Quiz=buildQuick5Quiz();
    STATE.quick5QIndex=0;STATE.quick5Selected=null;STATE.quick5Score=0;
    STATE.view="quick5";render();
  });
}

/* ── Boot ── */
(async function boot(){
  await loadState();
  render();
})();
</script>
